<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Visual Feeder AR Business Card</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #111;
      color: white;
      overflow: hidden;
    }

    #camera-status {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1200;
      max-width: 90%;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.6);
      font-size: 14px;
      text-align: center;
      line-height: 1.4;
      backdrop-filter: blur(4px);
    }

    #camera-status.error {
      background: rgba(160, 25, 25, 0.8);
    }

    #camera-status.ready {
      background: rgba(20, 110, 65, 0.82);
    }

    #target-indicator {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      border: 3px solid rgba(255, 255, 255, 0.7);
      border-radius: 18px;
      z-index: 1100;
      pointer-events: none;
      opacity: 0.9;
      box-sizing: border-box;
      display: none;
    }

    #target-indicator::before,
    #target-indicator::after {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: #fff;
      border-style: solid;
    }

    #target-indicator::before {
      top: -3px;
      left: -3px;
      border-width: 4px 0 0 4px;
      border-top-left-radius: 12px;
    }

    #target-indicator::after {
      right: -3px;
      bottom: -3px;
      border-width: 0 4px 4px 0;
      border-bottom-right-radius: 12px;
    }

    #target-indicator.active {
      border-color: rgba(76, 255, 133, 0.95);
      box-shadow: 0 0 18px rgba(76, 255, 133, 0.6);
      display: block;
    }

    #target-indicator.inactive {
      border-color: rgba(255, 215, 65, 0.9);
      box-shadow: 0 0 14px rgba(255, 215, 65, 0.5);
      display: block;
      animation: scan-pulse 1.5s ease-in-out infinite;
    }

    #ar-controls {
      position: fixed;
      left: 50%;
      bottom: calc(72px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 1300;
      display: none;
      gap: 10px;
      width: min(92vw, 380px);
    }

    #ar-controls.visible {
      display: flex;
    }

    #ar-controls button {
      flex: 1;
      min-height: 52px;
      border: 1px solid rgba(91, 203, 255, 0.8);
      border-radius: 14px;
      background: rgba(0, 117, 255, 0.26);
      color: white;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 0 10px rgba(0, 153, 255, 0.58), inset 0 0 12px rgba(0, 153, 255, 0.16);
      backdrop-filter: blur(10px);
      text-shadow: 0 0 8px rgba(110, 220, 255, 0.9);
      transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    #ar-controls button:active,
    #ar-controls button:focus-visible,
    #toggle-links:focus-visible,
    #social-links a:focus-visible {
      outline: 2px solid rgba(177, 238, 255, 0.95);
      outline-offset: 2px;
      background: rgba(0, 145, 255, 0.52);
      box-shadow: 0 0 18px rgba(0, 174, 255, 0.9), inset 0 0 14px rgba(0, 153, 255, 0.3);
    }

    #ar-controls button:active {
      transform: translateY(-2px);
    }

    #link-menu {
      position: fixed;
      top: 50%;
      right: max(12px, env(safe-area-inset-right));
      transform: translateY(-50%);
      z-index: 1300;
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    #link-menu.visible {
      display: flex;
    }

    #toggle-links {
      min-width: 92px;
      min-height: 48px;
      padding: 10px 14px;
      border: 1px solid rgba(91, 203, 255, 0.85);
      border-radius: 14px;
      background: rgba(0, 117, 255, 0.3);
      color: white;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 0 12px rgba(0, 153, 255, 0.62), inset 0 0 12px rgba(0, 153, 255, 0.18);
      backdrop-filter: blur(10px);
      text-shadow: 0 0 8px rgba(110, 220, 255, 0.9);
    }

    #social-links a {
      display: block;
      min-width: 92px;
      padding: 12px 14px;
      border: 1px solid rgba(91, 203, 255, 0.8);
      border-radius: 14px;
      background: rgba(0, 117, 255, 0.3);
      color: white;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 0 10px rgba(0, 153, 255, 0.5), inset 0 0 10px rgba(0, 153, 255, 0.16);
      backdrop-filter: blur(10px);
      text-shadow: 0 0 8px rgba(110, 220, 255, 0.9);
    }

    #social-links {
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    #link-menu.open #social-links {
      display: flex;
    }

    #social-links a:active {
      background: rgba(0, 145, 255, 0.52);
    }

    #gesture-hint {
      position: fixed;
      left: 50%;
      bottom: calc(136px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 1250;
      width: max-content;
      max-width: 88vw;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.78);
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      pointer-events: none;
    }

    #gesture-hint.visible {
      opacity: 1;
      visibility: visible;
    }

    #hand-drawer {
      position: fixed;
      top: 50%;
      right: max(12px, env(safe-area-inset-right));
      width: 250px;
      height: 250px;
      transform: translateY(-50%) scale(0.88);
      z-index: 1350;
      display: none;
      border: 1px solid rgba(90, 219, 255, 0.65);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 77, 135, 0.32), rgba(0, 12, 38, 0.72) 70%);
      box-shadow: 0 0 18px rgba(0, 174, 255, 0.62), inset 0 0 28px rgba(0, 153, 255, 0.32);
      backdrop-filter: blur(8px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      opacity: 0;
      pointer-events: none;
    }

    #hand-drawer.visible {
      display: block;
      transform: translateY(-50%) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    #hand-drawer::before {
      content: "CUBIT UNTUK PILIH";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 110px;
      transform: translate(-50%, -50%);
      color: rgba(185, 239, 255, 0.95);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      text-shadow: 0 0 8px #00aaff;
    }

    #hand-drawer button {
      position: absolute;
      width: 86px;
      min-height: 62px;
      padding: 8px;
      border: 1px solid rgba(116, 225, 255, 0.9);
      border-radius: 18px;
      background: rgba(0, 103, 201, 0.48);
      color: white;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 0 12px rgba(0, 174, 255, 0.7), inset 0 0 12px rgba(0, 153, 255, 0.24);
      text-shadow: 0 0 7px rgba(110, 220, 255, 0.9);
    }

    #hand-reset {
      top: 8px;
      left: 82px;
    }

    #hand-toggle {
      right: 4px;
      bottom: 46px;
    }

    #hand-links {
      bottom: 46px;
      left: 4px;
    }

    #hand-drawer button.selected {
      background: rgba(0, 195, 255, 0.78);
      box-shadow: 0 0 24px rgba(0, 215, 255, 1), inset 0 0 16px rgba(255, 255, 255, 0.28);
      transform: scale(1.08);
    }

    #hand-cursor {
      position: fixed;
      left: 0;
      top: 0;
      width: 30px;
      height: 30px;
      z-index: 1400;
      display: none;
      border: 2px solid rgba(131, 240, 255, 0.95);
      border-radius: 50%;
      background: rgba(0, 174, 255, 0.28);
      box-shadow: 0 0 16px rgba(0, 204, 255, 0.95), inset 0 0 10px rgba(0, 204, 255, 0.7);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #hand-cursor.visible {
      display: block;
    }

    #hand-cursor.pinching {
      background: rgba(0, 235, 255, 0.82);
      box-shadow: 0 0 22px rgba(0, 235, 255, 1), inset 0 0 12px rgba(255, 255, 255, 0.9);
    }

    @keyframes scan-pulse {
      50% { box-shadow: 0 0 20px rgba(255, 215, 65, 0.8); }
    }
  </style>
</head>
<body>

  <div id="camera-status">Memeriksa kamera...</div>
  <div id="target-indicator" class="inactive"></div>
  <div id="gesture-hint" role="status" aria-live="polite"></div>
  <div id="ar-controls" aria-label="Kontrol AR">
    <button id="reset-image" type="button">Atur ulang</button>
    <button id="toggle-image" type="button">Sembunyikan gambar</button>
  </div>
  <div id="link-menu">
    <button id="toggle-links" type="button" aria-expanded="false" aria-controls="social-links">Tautan</button>
    <nav id="social-links" aria-label="Tautan sekolah">
      <a href="https://smkbinamandirimultimedia.sch.id/" target="_blank" rel="noopener noreferrer">Website</a>
      <a href="https://www.instagram.com/smkbm_3/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </nav>
  </div>
  <div id="hand-drawer" role="group" aria-label="Laci kontrol gestur tangan">
    <button id="hand-reset" type="button">Atur ulang</button>
    <button id="hand-toggle" type="button">Sembunyikan gambar</button>
    <button id="hand-links" type="button">Tautan</button>
  </div>
  <div id="hand-cursor" aria-hidden="true"></div>
  <!-- Ganti imageTargetSrc dengan file .mind Anda -->
  <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiScanning: #scanning-overlay;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <img id="target-image" src="Karya/Artboard 1@300x-100.jpg">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity id="rotatable-image" position="0 0 0.65">
        <a-plane
          src="#target-image"
          width="1"
          height="1.78"
          material="shader: flat"
        ></a-plane>
        <a-plane
          src="#target-image"
          rotation="0 180 0"
          position="0 0 -0.002"
          width="1"
          height="1.78"
          material="shader: flat"
        ></a-plane>
      </a-entity>
    </a-entity>
  </a-scene>

  <div id="scanning-overlay" style="display: flex; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: white; z-index: 999; font-family: sans-serif; font-size: 20px;">
    Arahkan kamera ke kartu nama...
  </div>

  <script>
    const scene = document.querySelector('a-scene');
    const cameraStatus = document.getElementById('camera-status');
    const targetIndicator = document.getElementById('target-indicator');
    const gestureHint = document.getElementById('gesture-hint');
    const controls = document.getElementById('ar-controls');
    const linkMenu = document.getElementById('link-menu');
    const linksButton = document.getElementById('toggle-links');
    const resetButton = document.getElementById('reset-image');
    const toggleButton = document.getElementById('toggle-image');
    const handDrawer = document.getElementById('hand-drawer');
    const handCursor = document.getElementById('hand-cursor');
    const handResetButton = document.getElementById('hand-reset');
    const handToggleButton = document.getElementById('hand-toggle');
    const handLinksButton = document.getElementById('hand-links');
    const target = document.querySelector('[mindar-image-target]');
    const rotatableImage = document.getElementById('rotatable-image');
    let targetVisible = false;
    let imageEnabled = true;
    let activePointer = null;
    let previousPointerX = 0;
    let gestureHintTimeout = null;
    let animationFrame = null;
    const activePointers = new Map();
    let pinchStartDistance = 0;
    let pinchStartScale = 1;
    let handTracker = null;
    let handTrackingActive = false;
    let handTrackingError = false;
    let openPalmFrames = 0;
    let closedPalmFrames = 0;
    let openPalmLatched = false;
    let pinchWasActive = false;
    let highlightedHandButton = null;
    let lastHandFrameTime = -1;

    function setCameraStatus(message, type = '') {
      cameraStatus.textContent = message;
      cameraStatus.classList.remove('error', 'ready');
      if (type) cameraStatus.classList.add(type);
    }

    function setTargetIndicator(state) {
      targetIndicator.classList.remove('active', 'inactive');
      if (state === 'active') {
        targetIndicator.classList.add('active');
      } else if (state === 'inactive') {
        targetIndicator.classList.add('inactive');
      } else {
        targetIndicator.style.display = 'none';
      }
    }

    function updateImageVisibility() {
      rotatableImage.object3D.visible = targetVisible && imageEnabled;
      controls.classList.toggle('visible', targetVisible);
      linkMenu.classList.toggle('visible', targetVisible);
      toggleButton.textContent = imageEnabled ? 'Sembunyikan gambar' : 'Tampilkan gambar';
      handToggleButton.textContent = imageEnabled ? 'Sembunyikan gambar' : 'Tampilkan gambar';
    }

    function showGestureHint(message, fadeDelay = 5000) {
      window.clearTimeout(gestureHintTimeout);
      gestureHint.textContent = message;
      gestureHint.classList.add('visible');
      gestureHintTimeout = window.setTimeout(() => {
        gestureHint.classList.remove('visible');
      }, fadeDelay);
    }

    function animateImageIn() {
      if (animationFrame !== null) window.cancelAnimationFrame(animationFrame);

      const duration = 450;
      const startTime = performance.now();
      const startZ = 0.4;
      const endZ = 0.65;
      rotatableImage.object3D.position.z = startZ;
      rotatableImage.object3D.scale.setScalar(0.82);

      function animate(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        rotatableImage.object3D.position.z = startZ + (endZ - startZ) * eased;
        rotatableImage.object3D.scale.setScalar(0.82 + 0.18 * eased);
        if (progress < 1 && targetVisible && imageEnabled) {
          animationFrame = window.requestAnimationFrame(animate);
        } else {
          animationFrame = null;
        }
      }

      animationFrame = window.requestAnimationFrame(animate);
    }

    function getPointerDistance() {
      const points = Array.from(activePointers.values());
      if (points.length < 2) return 0;
      return Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
    }

    function landmarkDistance(first, second) {
      return Math.hypot(first.x - second.x, first.y - second.y);
    }

    function isOpenPalm(landmarks) {
      const wrist = landmarks[0];
      const extendedFingers = [
        [8, 6],
        [12, 10],
        [16, 14],
        [20, 18]
      ].filter(([tipIndex, jointIndex]) =>
        landmarkDistance(wrist, landmarks[tipIndex]) >
        landmarkDistance(wrist, landmarks[jointIndex]) * 1.12
      ).length;
      const palmWidth = landmarkDistance(landmarks[5], landmarks[17]);
      return extendedFingers >= 4 && palmWidth > 0.12;
    }

    function getHandMenuButtonAt(x, y) {
      if (!handDrawer.classList.contains('visible')) return null;
      return Array.from(handDrawer.querySelectorAll('button')).find(button => {
        const bounds = button.getBoundingClientRect();
        return x >= bounds.left && x <= bounds.right && y >= bounds.top && y <= bounds.bottom;
      }) || null;
    }

    function setHighlightedHandButton(button) {
      if (highlightedHandButton === button) return;
      if (highlightedHandButton) highlightedHandButton.classList.remove('selected');
      highlightedHandButton = button;
      if (highlightedHandButton) highlightedHandButton.classList.add('selected');
    }

    function closeHandDrawer() {
      handDrawer.classList.remove('visible');
      setHighlightedHandButton(null);
    }

    function handleHandResults(results) {
      const landmarks = results.multiHandLandmarks && results.multiHandLandmarks[0];
      if (!targetVisible || !landmarks) {
        handCursor.classList.remove('visible');
        setHighlightedHandButton(null);
        openPalmFrames = 0;
        closedPalmFrames++;
        if (closedPalmFrames >= 3) {
          openPalmLatched = false;
          pinchWasActive = false;
        }
        return;
      }

      const fingertip = landmarks[8];
      const screenX = fingertip.x * window.innerWidth;
      const screenY = fingertip.y * window.innerHeight;
      handCursor.style.left = `${screenX}px`;
      handCursor.style.top = `${screenY}px`;
      handCursor.classList.add('visible');

      const palmIsOpen = isOpenPalm(landmarks);
      if (palmIsOpen) {
        openPalmFrames++;
        closedPalmFrames = 0;
        if (openPalmFrames >= 3 && !openPalmLatched) {
          openPalmLatched = true;
          const isOpen = handDrawer.classList.toggle('visible');
          setHighlightedHandButton(null);
          showGestureHint(isOpen
            ? 'Laci gestur terbuka. Arahkan titik biru ke opsi, lalu cubit untuk memilih.'
            : 'Laci gestur ditutup.');
        }
      } else {
        openPalmFrames = 0;
        closedPalmFrames++;
        if (closedPalmFrames >= 3) openPalmLatched = false;
      }

      const selectedButton = getHandMenuButtonAt(screenX, screenY);
      setHighlightedHandButton(selectedButton);
      const pinchDistance = landmarkDistance(landmarks[4], landmarks[8]);
      const isPinching = pinchDistance < 0.045;
      handCursor.classList.toggle('pinching', isPinching);
      if (isPinching && !pinchWasActive && selectedButton) selectedButton.click();
      pinchWasActive = isPinching;
    }

    function startHandTracking() {
      if (handTrackingActive) return;
      if (typeof window.Hands !== 'function') {
        handTrackingError = true;
        setCameraStatus('Pelacakan tangan tidak tersedia. Gunakan tombol layar.', 'error');
        console.error('MediaPipe Hands failed to load; touch controls remain available.');
        return;
      }

      const cameraVideo = document.querySelector('a-scene video');
      if (!cameraVideo) {
        handTrackingError = true;
        setCameraStatus('Video kamera AR tidak ditemukan untuk pelacakan tangan.', 'error');
        console.error('MindAR camera video element was not found.');
        return;
      }

      try {
        handTracker = new window.Hands({
          locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        handTracker.setOptions({
          maxNumHands: 1,
          modelComplexity: 0,
          minDetectionConfidence: 0.65,
          minTrackingConfidence: 0.6
        });
        handTracker.onResults(handleHandResults);
        handTrackingActive = true;

        const processHandFrame = async () => {
          if (!handTrackingActive) return;
          try {
            if (targetVisible && cameraVideo.readyState >= 2 &&
                cameraVideo.currentTime !== lastHandFrameTime) {
              lastHandFrameTime = cameraVideo.currentTime;
              await handTracker.send({ image: cameraVideo });
            }
            window.setTimeout(processHandFrame, 100);
          } catch (error) {
            handTrackingActive = false;
            handTrackingError = true;
            handCursor.classList.remove('visible');
            setCameraStatus('Pelacakan tangan gagal. Gunakan tombol layar.', 'error');
            console.error('Hand tracking failed:', error);
          }
        };

        processHandFrame();
      } catch (error) {
        handTrackingActive = false;
        handTrackingError = true;
        setCameraStatus('Pelacakan tangan gagal dimulai. Gunakan tombol layar.', 'error');
        console.error('Unable to initialize hand tracking:', error);
      }
    }

    async function detectCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setCameraStatus('Browser Anda tidak mendukung kamera.', 'error');
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });

        setCameraStatus('Kamera aktif. Arahkan ke target AR.', 'ready');
        setTargetIndicator('inactive');
        stream.getTracks().forEach(track => track.stop());
      } catch (error) {
        setCameraStatus('Kamera tidak bisa diakses. Izinkan akses kamera di browser.', 'error');
        setTargetIndicator('none');
        console.error('Camera permission failed:', error);
      }
    }

    function setupRotationControls() {
      if (setupRotationControls.initialized) return;
      setupRotationControls.initialized = true;
      const canvas = scene.canvas;
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();

      canvas.style.touchAction = 'none';
      if (canvas.parentElement) canvas.parentElement.style.touchAction = 'none';

      document.addEventListener('pointerdown', event => {
        if (!targetVisible || !imageEnabled ||
            (event.target instanceof Element && event.target.closest('#ar-controls, #link-menu, #hand-drawer'))) return;

        const bounds = canvas.getBoundingClientRect();
        pointer.x = ((event.clientX - bounds.left) / bounds.width) * 2 - 1;
        pointer.y = -((event.clientY - bounds.top) / bounds.height) * 2 + 1;
        scene.object3D.updateMatrixWorld(true);
        raycaster.setFromCamera(pointer, scene.camera);

        if (raycaster.intersectObject(rotatableImage.object3D, true).length === 0) return;

        activePointers.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY,
          type: event.pointerType
        });

        if (activePointers.size === 1) {
          activePointer = event.pointerId;
          previousPointerX = event.clientX;
        } else if (activePointers.size === 2 && event.pointerType === 'touch') {
          activePointer = null;
          pinchStartDistance = getPointerDistance();
          pinchStartScale = rotatableImage.object3D.scale.x;
        }
      });

      document.addEventListener('pointermove', event => {
        if (!activePointers.has(event.pointerId) || !targetVisible || !imageEnabled) return;

        activePointers.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY,
          type: event.pointerType
        });

        if (activePointers.size >= 2 && pinchStartDistance > 0) {
          const scale = pinchStartScale * getPointerDistance() / pinchStartDistance;
          const clampedScale = Math.max(0.55, Math.min(1.6, scale));
          rotatableImage.object3D.scale.setScalar(clampedScale);
        } else if (event.pointerId === activePointer) {
          const deltaX = event.clientX - previousPointerX;
          rotatableImage.object3D.rotation.y += deltaX * 0.01;
          previousPointerX = event.clientX;
        }
        event.preventDefault();
      });

      const stopGesture = event => {
        activePointers.delete(event.pointerId);
        if (event.pointerId === activePointer) activePointer = null;
        if (activePointers.size < 2) {
          pinchStartDistance = 0;
          const remaining = activePointers.entries().next();
          if (!remaining.done) {
            activePointer = remaining.value[0];
            previousPointerX = remaining.value[1].x;
          }
        }
      };
      document.addEventListener('pointerup', stopGesture);
      document.addEventListener('pointercancel', stopGesture);
    }

    scene.addEventListener("loaded", setupRotationControls, { once: true });
    if (scene.hasLoaded) setupRotationControls();

    scene.addEventListener("ready", (event) => {
      console.log("Scene AR siap!");
      detectCamera();
    });
    scene.addEventListener('arReady', startHandTracking, { once: true });

    resetButton.addEventListener('click', () => {
      rotatableImage.object3D.rotation.set(0, 0, 0);
      rotatableImage.object3D.scale.setScalar(1);
      showGestureHint('Rotasi dan ukuran gambar dikembalikan ke awal.');
    });

    toggleButton.addEventListener('click', () => {
      imageEnabled = !imageEnabled;
      if (animationFrame !== null) {
        window.cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }
      updateImageVisibility();
      if (imageEnabled) showGestureHint('Gambar ditampilkan kembali.');
      else gestureHint.classList.remove('visible');
    });

    linksButton.addEventListener('click', () => {
      const isOpen = linkMenu.classList.toggle('open');
      linksButton.setAttribute('aria-expanded', String(isOpen));
      showGestureHint(isOpen ? 'Pilih Website atau Instagram untuk membuka tautan.' : 'Panel tautan ditutup.');
    });

    handResetButton.addEventListener('click', () => {
      resetButton.click();
      closeHandDrawer();
    });

    handToggleButton.addEventListener('click', () => {
      toggleButton.click();
      handToggleButton.textContent = imageEnabled ? 'Sembunyikan gambar' : 'Tampilkan gambar';
      closeHandDrawer();
    });

    handLinksButton.addEventListener('click', () => {
      linksButton.click();
      closeHandDrawer();
    });

    target.addEventListener("targetFound", event => {
        console.log("Target kartu nama ditemukan!");
        const overlay = document.querySelector('#scanning-overlay');
        if (overlay) overlay.style.display = 'none';
        targetVisible = true;
        updateImageVisibility();
        if (imageEnabled) animateImageIn();
        linkMenu.classList.remove('open');
        linksButton.setAttribute('aria-expanded', 'false');
        setCameraStatus(
          handTrackingError
            ? 'Target berhasil dipindai. Gestur tangan tidak tersedia; gunakan tombol layar.'
            : 'Target berhasil dipindai.',
          handTrackingError ? 'error' : 'ready'
        );
        showGestureHint('Usap untuk memutar · cubit untuk zoom · buka telapak untuk menu gestur.');
        setTargetIndicator('active');
    });

    target.addEventListener("targetLost", event => {
        console.log("Target kartu nama hilang.");
        const overlay = document.querySelector('#scanning-overlay');
        if (overlay) overlay.style.display = 'flex';
        targetVisible = false;
        activePointer = null;
        activePointers.clear();
        window.clearTimeout(gestureHintTimeout);
        gestureHint.classList.remove('visible');
        if (animationFrame !== null) {
          window.cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }
        linkMenu.classList.remove('open');
        linksButton.setAttribute('aria-expanded', 'false');
        closeHandDrawer();
        handCursor.classList.remove('visible', 'pinching');
        openPalmFrames = 0;
        closedPalmFrames = 0;
        openPalmLatched = false;
        pinchWasActive = false;
        updateImageVisibility();
        setCameraStatus('Target hilang. Arahkan kamera ke target lagi.', 'ready');
        setTargetIndicator('inactive');
    });
  </script>

</body>
</html>
