<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Visual Feeder AR Business Card</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #111;
      color: white;
      overflow: hidden;
    }

    #camera-status {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1200;
      max-width: 90%;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.6);
      font-size: 14px;
      text-align: center;
      line-height: 1.4;
      backdrop-filter: blur(4px);
    }

    #camera-status.error {
      background: rgba(160, 25, 25, 0.8);
    }

    #camera-status.ready {
      background: rgba(20, 110, 65, 0.82);
    }

    #camera-status.loading::before {
      content: "";
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 9px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: white;
      border-radius: 50%;
      vertical-align: -1px;
      animation: status-spin 0.8s linear infinite;
    }

    #scanning-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.22);
      pointer-events: none;
      font-family: sans-serif;
    }

    #scan-guidance {
      width: min(360px, 88vw);
      padding: 22px 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      background: rgba(7, 15, 25, 0.84);
      box-shadow: 0 14px 48px rgba(0, 0, 0, 0.35);
      text-align: center;
      backdrop-filter: blur(12px);
      pointer-events: auto;
    }

    #scan-guidance h1 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    #scan-guidance p {
      margin: 0;
      color: #c3d1df;
      font-size: 14px;
      line-height: 1.5;
    }

    #retry-camera {
      display: inline-flex;
      margin: 16px auto 0;
      padding: 10px 16px;
      border: 1px solid #57d2d9;
      border-radius: 10px;
      background: #087f91;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    #retry-camera:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #retry-camera:not(.visible) {
      display: none;
    }

    #retry-camera.visible {
      display: inline-flex;
    }

    #studio-sync-status {
      position: fixed;
      top: 62px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1200;
      max-width: 90%;
      padding: 6px 11px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.58);
      color: #d5e5f2;
      font-size: 11px;
      text-align: center;
    }

    #target-indicator {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1100;
      pointer-events: none;
      display: none;
    }

    #target-indicator polygon {
      fill: rgba(255, 215, 65, 0.06);
      stroke: rgba(255, 215, 65, 0.95);
      stroke-width: 5;
      vector-effect: non-scaling-stroke;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 7px rgba(255, 215, 65, 0.75));
    }

    #target-indicator.active {
      display: block;
    }

    #target-indicator.active polygon {
      fill: rgba(76, 255, 133, 0.08);
      stroke: rgba(76, 255, 133, 0.98);
      filter: drop-shadow(0 0 9px rgba(76, 255, 133, 0.8));
    }

    #target-indicator.inactive {
      display: block;
      animation: guide-pulse 1.6s ease-in-out infinite alternate;
    }

    #rotation-controller {
      position: fixed;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(76px, calc(env(safe-area-inset-bottom) + 64px));
      z-index: 1250;
      display: none;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: auto repeat(2, 44px) auto;
      align-items: center;
      justify-items: center;
      gap: 6px;
      padding: 10px;
      border: 1px solid rgba(91, 203, 255, 0.65);
      border-radius: 16px;
      background: rgba(0, 13, 40, 0.86);
      box-shadow: 0 0 18px rgba(0, 153, 255, 0.35);
      backdrop-filter: blur(10px);
    }

    #rotation-controller.visible {
      display: grid;
    }

    #rotation-controller h2 {
      grid-column: 1 / -1;
      margin: 0 0 2px;
      color: #d7f4ff;
      font-size: 12px;
      text-align: center;
    }

    #rotation-controller button {
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid rgba(91, 203, 255, 0.75);
      border-radius: 12px;
      background: rgba(0, 117, 255, 0.3);
      color: white;
      font-size: 20px;
      touch-action: manipulation;
    }

    #rotation-controller button:active,
    #rotation-controller button:focus-visible {
      outline: 2px solid rgba(177, 238, 255, 0.95);
      outline-offset: 2px;
      background: rgba(0, 145, 255, 0.65);
    }

    #rotation-controller [data-axis="x"] {
      color: #9fe8ff;
      font-size: 11px;
      font-weight: 700;
    }

    #parallax-toggle {
      grid-column: 1 / -1;
      width: auto !important;
      height: auto !important;
      min-height: 38px;
      padding: 7px 10px !important;
      font-size: 12px !important;
      font-weight: 700;
      white-space: nowrap;
    }

    #parallax-toggle[aria-pressed="true"] {
      border-color: #73e6bb !important;
      background: rgba(0, 145, 105, 0.62) !important;
    }

    #game-drawer {
      position: fixed;
      top: 50%;
      left: -150px;
      width: 300px;
      height: 300px;
      z-index: 1300;
      border: 1px solid rgba(91, 203, 255, 0.75);
      border-left: 0;
      border-radius: 0 150px 150px 0;
      background: radial-gradient(ellipse at right, rgba(0, 117, 255, 0.28), rgba(0, 13, 40, 0.9) 72%);
      box-shadow: 0 0 20px rgba(0, 153, 255, 0.52), inset -8px 0 24px rgba(0, 153, 255, 0.2);
      backdrop-filter: blur(12px);
      transform: translate(-90px, -50%);
      transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: none;
    }

    #game-drawer.visible {
      display: block;
    }

    #game-drawer.open {
      transform: translate(0, -50%);
    }

    #game-drawer.open #drawer-wheel {
      pointer-events: auto;
    }

    #game-drawer button {
      border: 1px solid rgba(91, 203, 255, 0.8);
      background: rgba(0, 117, 255, 0.34);
      color: white;
      box-shadow: 0 0 12px rgba(0, 153, 255, 0.62), inset 0 0 12px rgba(0, 153, 255, 0.2);
      backdrop-filter: blur(10px);
      text-shadow: 0 0 8px rgba(110, 220, 255, 0.9);
      cursor: pointer;
    }

    #game-drawer button:active,
    #game-drawer button:focus-visible,
    #social-links a:focus-visible {
      outline: 2px solid rgba(177, 238, 255, 0.95);
      outline-offset: 2px;
      background: rgba(0, 145, 255, 0.6);
      box-shadow: 0 0 20px rgba(0, 174, 255, 1), inset 0 0 14px rgba(0, 153, 255, 0.3);
    }

    #toggle-drawer {
      position: absolute;
      top: 8px;
      right: 0;
      width: 60px;
      min-height: 54px;
      border-radius: 18px 0 0 18px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
    }

    #toggle-drawer::before {
      content: "›";
      display: block;
      font-size: 24px;
      line-height: 20px;
    }

    #game-drawer.open #toggle-drawer::before {
      content: "‹";
    }

    #drawer-wheel {
      position: absolute;
      inset: 0;
      pointer-events: none;
      touch-action: none;
      cursor: grab;
    }

    #drawer-wheel:active {
      cursor: grabbing;
    }

    #drawer-wheel::before {
      content: "";
      position: absolute;
      left: 178px;
      top: 103px;
      width: 94px;
      height: 94px;
      border: 1px dashed rgba(128, 223, 255, 0.45);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(0, 153, 255, 0.22);
      pointer-events: none;
    }

    #drawer-wheel::after {
      content: "↻";
      position: absolute;
      left: 207px;
      top: 131px;
      color: rgba(177, 238, 255, 0.88);
      font-size: 28px;
      line-height: 36px;
      text-shadow: 0 0 12px rgba(0, 174, 255, 0.95);
      pointer-events: none;
    }

    .drawer-action {
      position: absolute;
      left: 0;
      top: 0;
      width: 70px;
      min-height: 48px;
      padding: 6px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) rotate(var(--counter-rotation, 0deg));
      transition: opacity 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    #game-drawer.open .drawer-action {
      opacity: 1;
      pointer-events: auto;
    }

    #social-links {
      position: absolute;
      top: 50%;
      left: calc(100% + 6px);
      display: none;
      flex-direction: column;
      gap: 10px;
      width: min(144px, calc(100vw - 166px));
      transform: translateY(-50%);
    }

    #game-drawer.links-open #social-links {
      display: flex;
    }

    #social-links a {
      display: block;
      padding: 13px 12px;
      border: 1px solid rgba(91, 203, 255, 0.85);
      border-radius: 14px;
      background: rgba(0, 30, 74, 0.9);
      color: white;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 0 12px rgba(0, 153, 255, 0.58), inset 0 0 12px rgba(0, 153, 255, 0.18);
      backdrop-filter: blur(10px);
      text-shadow: 0 0 8px rgba(110, 220, 255, 0.9);
    }

    #gesture-hint {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 1250;
      width: max-content;
      max-width: 88vw;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.78);
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      pointer-events: none;
    }

    #gesture-hint.visible {
      opacity: 1;
      visibility: visible;
    }

    @keyframes guide-pulse {
      from { opacity: 0.48; }
      to { opacity: 1; }
    }

    @keyframes status-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #camera-status.loading::before,
      #target-indicator.inactive {
        animation: none;
      }
    }
  </style>
</head>
<body>

  <div id="camera-status" class="loading" role="status" aria-live="polite">Memeriksa kamera...</div>
  <div id="studio-sync-status" role="status" aria-live="polite">Memeriksa katalog Studio...</div>
  <svg id="target-indicator" class="inactive" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">
    <polygon id="target-indicator-shape" points="0,0 0,0 0,0 0,0"></polygon>
  </svg>
  <div id="gesture-hint" role="status" aria-live="polite"></div>
  <section id="rotation-controller" aria-label="Kontrol rotasi karya" aria-hidden="true">
    <h2>Rotasi 360°</h2>
    <span></span>
    <button type="button" data-axis="x" data-step="-15" aria-label="Putar ke atas 15 derajat">↑</button>
    <span></span>
    <button type="button" data-axis="y" data-step="-15" aria-label="Putar ke kiri 15 derajat">←</button>
    <button type="button" data-axis="x" data-step="15" aria-label="Putar ke bawah 15 derajat">↓</button>
    <button type="button" data-axis="y" data-step="15" aria-label="Putar ke kanan 15 derajat">→</button>
    <button id="parallax-toggle" type="button" aria-pressed="false">Aktifkan Parallax</button>
  </section>
  <div id="game-drawer" aria-label="Menu AR">
    <button id="toggle-drawer" type="button" aria-expanded="false" aria-controls="drawer-reset drawer-toggle-image drawer-toggle-links">MENU</button>
    <div id="drawer-wheel">
      <button id="drawer-reset" class="drawer-action" type="button">Atur ulang</button>
      <button id="drawer-toggle-image" class="drawer-action" type="button">Sembunyikan gambar</button>
      <button id="drawer-toggle-links" class="drawer-action" type="button" aria-expanded="false" aria-controls="social-links">Tautan</button>
    </div>
    <nav id="social-links" aria-label="Tautan sekolah">
      <a href="https://smkbinamandirimultimedia.sch.id/" target="_blank" rel="noopener noreferrer">Website</a>
      <a href="https://www.instagram.com/smkbm_3/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </nav>
  </div>
  <!-- Ganti imageTargetSrc dengan file .mind Anda -->
  <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiScanning: #scanning-overlay;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <img id="target-image-0" src="Karya/Artboard 1@300x-100.jpg">
      <img id="target-image-1" src="Karya/Bilqis X DKV 01.png">
      <img id="target-image-2" src="Karya/Rizka Afrilia Azzahra XI DKV 2 .png">
      <img id="target-image-3" src="Karya/maaf salah masukin.jpg">
      <img id="parallax-background" src="Parallax File/parallax_layers_af82139e/03_background.png">
      <img id="parallax-midground" src="Parallax File/parallax_layers_af82139e/02_midground.png">
      <img id="parallax-foreground" src="Parallax File/parallax_layers_af82139e/01_foreground.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="image-target-0" mindar-image-target="targetIndex: 0" data-image-id="target-image-0">
      <a-entity id="rotatable-image-0" class="rotatable-image" position="0 0 0.65">
        <a-plane
          src="#target-image-0"
          width="1"
          height="1.78"
          material="shader: flat"
        ></a-plane>
        <a-plane
          src="#target-image-0"
          rotation="0 180 0"
          position="0 0 -0.002"
          width="1"
          height="1.78"
          material="shader: flat"
        ></a-plane>
      </a-entity>
    </a-entity>

    <a-entity id="image-target-1" mindar-image-target="targetIndex: 1" data-image-id="target-image-1">
      <a-entity id="rotatable-image-1" class="rotatable-image" position="0 0 0.65">
        <a-plane src="#target-image-1" width="1" height="1.414" material="shader: flat"></a-plane>
        <a-plane src="#target-image-1" rotation="0 180 0" position="0 0 -0.002" width="1" height="1.414" material="shader: flat"></a-plane>
      </a-entity>
    </a-entity>

    <a-entity id="image-target-2" mindar-image-target="targetIndex: 2" data-image-id="target-image-2">
      <a-entity id="rotatable-image-2" class="rotatable-image" position="0 0 0.65">
        <a-plane src="#target-image-2" width="1" height="1.414" material="shader: flat"></a-plane>
        <a-plane src="#target-image-2" rotation="0 180 0" position="0 0 -0.002" width="1" height="1.414" material="shader: flat"></a-plane>
      </a-entity>
    </a-entity>

    <a-entity id="image-target-3" mindar-image-target="targetIndex: 3" data-image-id="target-image-3">
      <a-entity id="rotatable-image-3" class="rotatable-image" position="0 0 0.65">
        <a-plane src="#target-image-3" width="1" height="0.702" material="shader: flat"></a-plane>
        <a-plane src="#target-image-3" rotation="0 180 0" position="0 0 -0.002" width="1" height="0.702" material="shader: flat"></a-plane>
      </a-entity>
    </a-entity>
  </a-scene>

  <div id="scanning-overlay" aria-live="polite">
    <section id="scan-guidance">
      <h1 id="scan-guidance-title">Siap memindai?</h1>
      <p id="scan-guidance-description">Tekan tombol untuk mengaktifkan kamera dan mulai mencari marker.</p>
      <button id="retry-camera" class="visible" type="button">Mulai pemindaian</button>
    </section>
  </div>

  <script>
    async function initializeAR() {
    const scene = document.querySelector('a-scene');
    const cameraStatus = document.getElementById('camera-status');
    const scanGuidanceTitle = document.getElementById('scan-guidance-title');
    const scanGuidanceDescription = document.getElementById('scan-guidance-description');
    const retryCameraButton = document.getElementById('retry-camera');
    const targetIndicator = document.getElementById('target-indicator');
    const targetIndicatorShape = document.getElementById('target-indicator-shape');
    const gestureHint = document.getElementById('gesture-hint');
    const rotationController = document.getElementById('rotation-controller');
    const parallaxToggle = document.getElementById('parallax-toggle');
    const gameDrawer = document.getElementById('game-drawer');
    const drawerWheel = document.getElementById('drawer-wheel');
    const drawerButton = document.getElementById('toggle-drawer');
    const resetButton = document.getElementById('drawer-reset');
    const toggleButton = document.getElementById('drawer-toggle-image');
    const linksButton = document.getElementById('drawer-toggle-links');
    let targets = [];
    let activeTarget = null;
    let activeTargetImage = null;
    let rotatableImage = null;
    let targetVisible = false;
    let imageEnabled = true;
    let parallaxEnabled = false;
    let activeParallaxRoot = null;
    let activeParallaxLayers = [];
    let parallaxPermissionRequested = false;
    let activePointer = null;
    let previousPointerX = 0;
    let previousPointerY = 0;
    let gestureHintTimeout = null;
    let animationFrame = null;
    let guideAnimationFrame = null;
    let guideHideTimeout = null;
    let drawerPointerId = null;
    let lastDrawerPointerAngle = 0;
    let drawerRotation = 0;
    const activePointers = new Map();
    let pinchStartDistance = 0;
    let pinchStartScale = 1;
    const SCAN_GUIDE_VISIBLE_MS = 1200;

    function setCameraStatus(message, type = '') {
      cameraStatus.textContent = message;
      cameraStatus.classList.remove('error', 'ready', 'loading');
      if (type) cameraStatus.classList.add(type);
    }

    function setScanGuidance(title, description, retry = false) {
      scanGuidanceTitle.textContent = title;
      scanGuidanceDescription.textContent = description;
      retryCameraButton.classList.toggle('visible', retry);
    }

    function setTargetIndicator(state) {
      targetIndicator.classList.remove('active', 'inactive');
      if (state === 'active') {
        targetIndicator.classList.add('active');
      } else if (state === 'inactive') {
        targetIndicator.classList.add('inactive');
        targetIndicator.style.display = 'block';
      } else {
        targetIndicator.style.display = 'none';
      }
    }

    function setGuidePoints(points) {
      targetIndicatorShape.setAttribute(
        'points',
        points.map(point => `${point.x},${point.y}`).join(' ')
      );
    }

    function getSmallGuidePoints() {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const size = Math.min(44, window.innerWidth * 0.14, window.innerHeight * 0.08);
      const half = size / 2;
      return [
        { x: centerX - half, y: centerY - half },
        { x: centerX + half, y: centerY - half },
        { x: centerX + half, y: centerY + half },
        { x: centerX - half, y: centerY + half }
      ];
    }

    function getTargetScreenPoints() {
      if (!scene.camera || !activeTarget || !activeTargetImage) return null;
      scene.object3D.updateMatrixWorld(true);
      scene.camera.updateMatrixWorld(true);
      const halfHeight = activeTargetImage.naturalHeight / activeTargetImage.naturalWidth / 2;
      const corners = [
        [-0.5, -halfHeight, 0],
        [0.5, -halfHeight, 0],
        [0.5, halfHeight, 0],
        [-0.5, halfHeight, 0]
      ];
      const points = corners.map(([x, y, z]) => {
        const point = activeTarget.object3D.localToWorld(new THREE.Vector3(x, y, z));
        point.project(scene.camera);
        return {
          x: (point.x + 1) * 0.5 * window.innerWidth,
          y: (1 - point.y) * 0.5 * window.innerHeight
        };
      });
      return points.every(point => Number.isFinite(point.x) && Number.isFinite(point.y))
        ? points
        : null;
    }

    function resetScanGuide() {
      window.clearTimeout(guideHideTimeout);
      if (guideAnimationFrame !== null) {
        window.cancelAnimationFrame(guideAnimationFrame);
        guideAnimationFrame = null;
      }
      targetIndicator.setAttribute('viewBox', `0 0 ${window.innerWidth} ${window.innerHeight}`);
      setGuidePoints(getSmallGuidePoints());
      setTargetIndicator('inactive');
    }

    function animateScanGuideToTarget() {
      window.clearTimeout(guideHideTimeout);
      if (guideAnimationFrame !== null) window.cancelAnimationFrame(guideAnimationFrame);
      const startPoints = getSmallGuidePoints();
      const startTime = performance.now();
      const duration = 420;

      function animate(now) {
        if (!targetVisible) {
          guideAnimationFrame = null;
          return;
        }
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const currentTargetPoints = getTargetScreenPoints();
        if (currentTargetPoints) {
          setGuidePoints(progress < 1
            ? startPoints.map((point, index) => ({
              x: point.x + (currentTargetPoints[index].x - point.x) * eased,
              y: point.y + (currentTargetPoints[index].y - point.y) * eased
            }))
            : currentTargetPoints);
        }
        if (elapsed >= SCAN_GUIDE_VISIBLE_MS) {
          setTargetIndicator('none');
          guideAnimationFrame = null;
          return;
        }
        guideAnimationFrame = window.requestAnimationFrame(animate);
      }

      setTargetIndicator('active');
      targetIndicator.setAttribute('viewBox', `0 0 ${window.innerWidth} ${window.innerHeight}`);
      guideAnimationFrame = window.requestAnimationFrame(animate);
      guideHideTimeout = window.setTimeout(() => {
        if (targetVisible) setTargetIndicator('none');
        if (guideAnimationFrame !== null) {
          window.cancelAnimationFrame(guideAnimationFrame);
          guideAnimationFrame = null;
        }
      }, SCAN_GUIDE_VISIBLE_MS);
    }

    function updateDrawerWheel() {
      const actions = [resetButton, toggleButton, linksButton];
      const baseAngles = [-90, 30, 150];
      const pivotX = 225;
      const pivotY = 150;
      const radius = 40;
      actions.forEach((button, index) => {
        const angle = (baseAngles[index] + drawerRotation) * Math.PI / 180;
        const centerX = pivotX + Math.cos(angle) * radius;
        const centerY = pivotY + Math.sin(angle) * radius;
        button.style.left = `${centerX}px`;
        button.style.top = `${centerY}px`;
        button.style.setProperty('--counter-rotation', `${-drawerRotation}deg`);
      });
    }

    function getDrawerPointerAngle(event) {
      const bounds = gameDrawer.getBoundingClientRect();
      const pivotX = bounds.left + 225;
      const pivotY = bounds.top + 150;
      return Math.atan2(event.clientY - pivotY, event.clientX - pivotX) * 180 / Math.PI;
    }

    function updateImageVisibility() {
      rotatableImage.object3D.visible = targetVisible && imageEnabled;
      const originalPlanes = rotatableImage.querySelectorAll('.ar-content-plane');
      originalPlanes.forEach(plane => {
        plane.object3D.visible = !parallaxEnabled;
      });
      if (activeParallaxRoot) activeParallaxRoot.object3D.visible = parallaxEnabled;
      gameDrawer.classList.toggle('visible', targetVisible);
      rotationController.classList.toggle('visible', targetVisible && imageEnabled);
      rotationController.setAttribute('aria-hidden', String(!targetVisible || !imageEnabled));
      toggleButton.textContent = imageEnabled ? 'Sembunyikan gambar' : 'Tampilkan gambar';
    }

    function setParallaxOffset(horizontal, vertical) {
      if (!parallaxEnabled) return;
      const maxOffset = 0.055;
      activeParallaxLayers.forEach(layer => {
        const depth = Number(layer.dataset.parallaxDepth);
        layer.object3D.position.x = horizontal * maxOffset * depth;
        layer.object3D.position.y = -vertical * maxOffset * depth;
      });
    }

    function handleDeviceOrientation(event) {
      if (typeof event.gamma !== 'number' || typeof event.beta !== 'number') return;
      setParallaxOffset(
        Math.max(-1, Math.min(1, event.gamma / 35)),
        Math.max(-1, Math.min(1, (event.beta - 45) / 35))
      );
    }

    async function toggleParallax() {
      if (!targetVisible || !imageEnabled) return;
      const enabling = !parallaxEnabled;
      if (enabling) {
        const missingAssets = ['parallax-background', 'parallax-midground', 'parallax-foreground']
          .filter(id => {
            const image = document.getElementById(id);
            return !image || !image.complete || image.naturalWidth === 0;
          });
        if (missingAssets.length) {
          console.error('Aset Parallax gagal dimuat:', missingAssets);
          showGestureHint('Layer Parallax gagal dimuat. Periksa file di folder Parallax File.');
          return;
        }
      }
      if (enabling && !parallaxPermissionRequested) {
        parallaxPermissionRequested = true;
        const orientation = window.DeviceOrientationEvent;
        if (typeof orientation?.requestPermission === 'function') {
          try {
            const permission = await orientation.requestPermission();
            if (permission !== 'granted') {
              showGestureHint('Izin sensor gerak ditolak. Parallax dapat dicoba dengan menggerakkan pointer.');
            }
          } catch (error) {
            console.warn('Izin sensor gerak tidak tersedia:', error);
            showGestureHint('Sensor gerak tidak tersedia. Parallax dapat dicoba dengan menggerakkan pointer.');
          }
        }
      }
      parallaxEnabled = enabling;
      parallaxToggle.setAttribute('aria-pressed', String(parallaxEnabled));
      parallaxToggle.textContent = parallaxEnabled ? 'Matikan Parallax' : 'Aktifkan Parallax';
      if (parallaxEnabled) {
        window.addEventListener('deviceorientation', handleDeviceOrientation);
        setParallaxOffset(0, 0);
        showGestureHint('Parallax aktif. Miringkan HP perlahan untuk menggerakkan layer.');
      } else {
        window.removeEventListener('deviceorientation', handleDeviceOrientation);
        setParallaxOffset(0, 0);
        showGestureHint('Parallax dimatikan.');
      }
      updateImageVisibility();
    }

    function closeDrawer() {
      gameDrawer.classList.remove('open', 'links-open');
      drawerButton.setAttribute('aria-expanded', 'false');
      linksButton.setAttribute('aria-expanded', 'false');
    }

    function showGestureHint(message, fadeDelay = 5000) {
      window.clearTimeout(gestureHintTimeout);
      gestureHint.textContent = message;
      gestureHint.classList.add('visible');
      gestureHintTimeout = window.setTimeout(() => {
        gestureHint.classList.remove('visible');
      }, fadeDelay);
    }

    function animateImageIn() {
      if (animationFrame !== null) window.cancelAnimationFrame(animationFrame);

      const duration = 450;
      const startTime = performance.now();
      const endZ = Number(rotatableImage.dataset.baseZ || 0.65);
      const startZ = endZ - 0.25;
      rotatableImage.object3D.position.z = startZ;
      rotatableImage.object3D.scale.setScalar(0.82);

      function animate(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        rotatableImage.object3D.position.z = startZ + (endZ - startZ) * eased;
        rotatableImage.object3D.scale.setScalar(0.82 + 0.18 * eased);
        if (progress < 1 && targetVisible && imageEnabled) {
          animationFrame = window.requestAnimationFrame(animate);
        } else {
          animationFrame = null;
        }
      }

      animationFrame = window.requestAnimationFrame(animate);
    }

    function getPointerDistance() {
      const points = Array.from(activePointers.values());
      if (points.length < 2) return 0;
      return Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
    }

    function checkCameraSupport() {
      if (!window.isSecureContext) {
        setCameraStatus('Kamera memerlukan HTTPS atau localhost.', 'error');
        setScanGuidance('Koneksi belum aman', 'Buka aplikasi melalui HTTPS atau http://localhost untuk menggunakan kamera.');
        retryCameraButton.classList.remove('visible');
        return false;
      }
      if (!navigator.mediaDevices?.getUserMedia) {
        setCameraStatus('Browser ini tidak mendukung akses kamera.', 'error');
        setScanGuidance('Kamera tidak didukung', 'Buka halaman ini menggunakan browser modern yang mendukung kamera.');
        retryCameraButton.classList.remove('visible');
        return false;
      }
      return true;
    }

    function getCameraErrorMessage(error) {
      const detail = error?.detail?.error || error?.error || error;
      const name = detail?.name || detail?.message || detail;
      if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
        return {
          status: 'Izin kamera ditolak. Izinkan akses kamera untuk situs ini.',
          title: 'Izin kamera diperlukan',
          description: 'Izinkan penggunaan kamera pada pengaturan situs, lalu coba lagi.'
        };
      }
      if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
        return {
          status: 'Kamera tidak ditemukan pada perangkat ini.',
          title: 'Kamera tidak ditemukan',
          description: 'Pastikan perangkat memiliki kamera dan tidak sedang dinonaktifkan.'
        };
      }
      if (name === 'NotReadableError' || name === 'TrackStartError') {
        return {
          status: 'Kamera sedang digunakan aplikasi lain.',
          title: 'Kamera sedang digunakan',
          description: 'Tutup aplikasi lain yang memakai kamera, lalu coba lagi.'
        };
      }
      if (name === 'OverconstrainedError' || name === 'ConstraintNotSatisfiedError') {
        return {
          status: 'Kamera tidak mendukung pengaturan yang diminta.',
          title: 'Kamera tidak cocok',
          description: 'Coba gunakan kamera atau perangkat lain.'
        };
      }
      return {
        status: 'AR gagal dimulai. Periksa kamera, izin situs, dan file marker.',
        title: 'Kamera AR gagal dimulai',
        description: 'Pastikan kamera tersedia, izin diberikan, dan file targets.mind dapat dimuat.'
      };
    }

    function setupRotationControls() {
      if (setupRotationControls.initialized) return;
      setupRotationControls.initialized = true;
      const canvas = scene.canvas;

      canvas.style.touchAction = 'none';
      if (canvas.parentElement) canvas.parentElement.style.touchAction = 'none';

      document.addEventListener('pointerdown', event => {
        if (!targetVisible || !imageEnabled ||
            (event.target instanceof Element && event.target.closest('#game-drawer, #rotation-controller'))) return;
        if (!(event.target instanceof Node) || !canvas.contains(event.target)) return;

        activePointers.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY,
          type: event.pointerType
        });
        if (canvas.setPointerCapture && event.pointerId >= 0) {
          try {
            canvas.setPointerCapture(event.pointerId);
          } catch (error) {
            console.warn('Pointer capture tidak tersedia untuk gesture AR:', error);
          }
        }
        event.preventDefault();

        if (activePointers.size === 1) {
          activePointer = event.pointerId;
          previousPointerX = event.clientX;
          previousPointerY = event.clientY;
        } else if (activePointers.size === 2 && event.pointerType === 'touch') {
          activePointer = null;
          pinchStartDistance = getPointerDistance();
          pinchStartScale = rotatableImage.object3D.scale.x;
        }
      });

      document.addEventListener('pointermove', event => {
        if (!activePointers.has(event.pointerId) || !targetVisible || !imageEnabled) return;

        activePointers.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY,
          type: event.pointerType
        });

        if (activePointers.size >= 2 && pinchStartDistance > 0) {
          const scale = pinchStartScale * getPointerDistance() / pinchStartDistance;
          const clampedScale = Math.max(0.55, Math.min(1.6, scale));
          rotatableImage.object3D.scale.setScalar(clampedScale);
        } else if (event.pointerId === activePointer) {
          const deltaX = event.clientX - previousPointerX;
          const deltaY = event.clientY - previousPointerY;
          rotatableImage.object3D.rotation.y += deltaX * 0.01;
          rotatableImage.object3D.rotation.x += deltaY * 0.01;
          previousPointerX = event.clientX;
          previousPointerY = event.clientY;
        }
        event.preventDefault();
      });

      canvas.addEventListener('pointermove', event => {
        if (!parallaxEnabled || event.pointerType !== 'mouse' || !targetVisible) return;
        const bounds = canvas.getBoundingClientRect();
        const horizontal = ((event.clientX - bounds.left) / bounds.width - 0.5) * 2;
        const vertical = ((event.clientY - bounds.top) / bounds.height - 0.5) * 2;
        setParallaxOffset(horizontal, vertical);
      });

      const stopGesture = event => {
        activePointers.delete(event.pointerId);
        if (event.pointerId === activePointer) activePointer = null;
        if (activePointers.size < 2) {
          pinchStartDistance = 0;
          const remaining = activePointers.entries().next();
          if (!remaining.done) {
            activePointer = remaining.value[0];
            previousPointerX = remaining.value[1].x;
            previousPointerY = remaining.value[1].y;
          }
        }
      };
      document.addEventListener('pointerup', stopGesture);
      document.addEventListener('pointercancel', stopGesture);
    }

    scene.addEventListener("loaded", setupRotationControls, { once: true });
    if (scene.hasLoaded) setupRotationControls();

    scene.addEventListener("arReady", () => {
      console.log("Scene AR siap!");
      resetScanGuide();
      setCameraStatus('Kamera aktif. Arahkan ke marker.', 'ready');
      setScanGuidance('Arahkan kamera ke marker', 'Dekatkan gambar target ke dalam bingkai dan pastikan pencahayaan cukup.');
      retryCameraButton.classList.remove('visible');
      retryCameraButton.textContent = 'Mulai pemindaian';
    });
    scene.addEventListener("arError", event => {
      const message = getCameraErrorMessage(event);
      setCameraStatus(message.status, 'error');
      setScanGuidance(message.title, message.description, true);
      retryCameraButton.textContent = 'Coba kamera lagi';
      setTargetIndicator('none');
      console.error('MindAR startup error:', event.detail || event);
    });

    window.addEventListener('resize', () => {
      targetIndicator.setAttribute('viewBox', `0 0 ${window.innerWidth} ${window.innerHeight}`);
      if (!targetVisible) resetScanGuide();
    });

    drawerButton.addEventListener('click', () => {
      const isOpen = gameDrawer.classList.toggle('open');
      drawerButton.setAttribute('aria-expanded', String(isOpen));
      if (!isOpen) {
        gameDrawer.classList.remove('links-open');
        linksButton.setAttribute('aria-expanded', 'false');
      }
    });

    resetButton.addEventListener('click', () => {
      rotatableImage.object3D.rotation.set(0, 0, 0);
      rotatableImage.object3D.scale.setScalar(1);
      closeDrawer();
      showGestureHint('Rotasi dan ukuran gambar dikembalikan ke awal.');
    });

    rotationController.addEventListener('click', event => {
      const button = event.target instanceof Element
        ? event.target.closest('button[data-axis][data-step]')
        : null;
      if (!button) return;
      if (!rotatableImage || !targetVisible || !imageEnabled) return;
      const axis = button.dataset.axis;
      if (axis !== 'x' && axis !== 'y') return;
      const step = Number(button.dataset.step);
      if (!Number.isFinite(step)) return;
      rotatableImage.object3D.rotation[axis] += step * Math.PI / 180;
    });
    parallaxToggle.addEventListener('click', toggleParallax);

    toggleButton.addEventListener('click', () => {
      imageEnabled = !imageEnabled;
      if (animationFrame !== null) {
        window.cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }
      updateImageVisibility();
      closeDrawer();
      if (imageEnabled) showGestureHint('Gambar ditampilkan kembali.');
      else gestureHint.classList.remove('visible');
    });

    linksButton.addEventListener('click', () => {
      const isOpen = gameDrawer.classList.toggle('links-open');
      linksButton.setAttribute('aria-expanded', String(isOpen));
      showGestureHint(isOpen ? 'Pilih Website atau Instagram untuk membuka tautan.' : 'Panel tautan ditutup.');
    });

    drawerWheel.addEventListener('pointerdown', event => {
      if (!gameDrawer.classList.contains('open') ||
          (event.target instanceof Element && event.target.closest('button, a'))) return;
      drawerPointerId = event.pointerId;
      lastDrawerPointerAngle = getDrawerPointerAngle(event);
      drawerWheel.setPointerCapture(event.pointerId);
      event.preventDefault();
    });

    drawerWheel.addEventListener('pointermove', event => {
      if (event.pointerId !== drawerPointerId) return;
      const currentAngle = getDrawerPointerAngle(event);
      let delta = currentAngle - lastDrawerPointerAngle;
      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;
      drawerRotation = (drawerRotation + delta) % 360;
      lastDrawerPointerAngle = currentAngle;
      updateDrawerWheel();
    });

    const stopDrawerRotation = event => {
      if (event.pointerId === drawerPointerId) drawerPointerId = null;
    };
    drawerWheel.addEventListener('pointerup', stopDrawerRotation);
    drawerWheel.addEventListener('pointercancel', stopDrawerRotation);

    targets = Array.from(document.querySelectorAll('[mindar-image-target]'));
    targets.forEach(target => {
      const content = target.querySelector('.rotatable-image');
      if (!content) {
        console.error(`Konten AR untuk target "${target.id}" tidak ditemukan.`);
        return;
      }
      content.querySelectorAll('a-plane').forEach(plane => plane.classList.add('ar-content-plane'));
      const parallaxLayers = [
        { asset: 'parallax-background', depth: 0.12 },
        { asset: 'parallax-midground', depth: 0.32 },
        { asset: 'parallax-foreground', depth: 0.62 }
      ];
      const parallaxRoot = document.createElement('a-entity');
      parallaxRoot.classList.add('parallax-layers');
      parallaxRoot.object3D.visible = false;
      parallaxLayers.forEach(({ asset, depth }) => {
        const plane = document.createElement('a-plane');
        plane.classList.add('parallax-layer');
        plane.dataset.parallaxDepth = String(depth);
        plane.setAttribute('src', `#${asset}`);
        plane.setAttribute('width', '1');
        plane.setAttribute('height', String(922 / 783));
        plane.setAttribute('material', 'shader: flat; transparent: true; alphaTest: 0.05; side: double');
        plane.setAttribute('position', `0 0 ${depth * 0.012}`);
        parallaxRoot.append(plane);
      });
      content.append(parallaxRoot);

      target.addEventListener("targetFound", () => {
        console.log(`Target gambar ${target.id} ditemukan!`);
        activeTarget = target;
        activeTargetImage = document.getElementById(target.dataset.imageId);
        rotatableImage = content;
        activeParallaxRoot = parallaxRoot;
        activeParallaxLayers = Array.from(parallaxRoot.querySelectorAll('.parallax-layer'));
        if (!rotatableImage) {
          console.error(`Konten AR untuk target "${target.id}" tidak ditemukan.`);
          setCameraStatus('Konten karya AR gagal dimuat.', 'error');
          return;
        }
        const overlay = document.querySelector('#scanning-overlay');
        if (overlay) overlay.style.display = 'none';
        const video = target.querySelector('video');
        if (video) video.play().catch(error => console.warn('Autoplay video AR diblokir:', error));
        targetVisible = true;
        updateImageVisibility();
        if (imageEnabled) animateImageIn();
        closeDrawer();
        setCameraStatus('Target berhasil dipindai.', 'ready');
        setScanGuidance('Marker terdeteksi', 'Pertahankan marker dalam pandangan kamera.');
        showGestureHint('Usap gambar ke segala arah untuk rotasi 360° · cubit untuk zoom · gunakan tombol kontrol.');
        animateScanGuideToTarget();
      });

      target.addEventListener("targetLost", () => {
        if (activeTarget !== target) return;
        console.log(`Target gambar ${target.id} hilang.`);
        const overlay = document.querySelector('#scanning-overlay');
        if (overlay) overlay.style.display = 'flex';
        const video = target.querySelector('video');
        if (video) video.pause();
        targetVisible = false;
        if (parallaxEnabled) {
          window.removeEventListener('deviceorientation', handleDeviceOrientation);
          parallaxEnabled = false;
          parallaxToggle.setAttribute('aria-pressed', 'false');
          parallaxToggle.textContent = 'Aktifkan Parallax';
        }
        activeParallaxRoot = null;
        activeParallaxLayers = [];
        activePointer = null;
        activePointers.clear();
        drawerPointerId = null;
        window.clearTimeout(gestureHintTimeout);
        gestureHint.classList.remove('visible');
        if (animationFrame !== null) {
          window.cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }
        closeDrawer();
        updateImageVisibility();
        setCameraStatus('Marker hilang. Arahkan kamera ke marker lagi.', 'ready');
        setScanGuidance('Cari marker', 'Geser kamera perlahan dan jaga marker tetap terang serta terlihat utuh.');
        activeTarget = null;
        activeTargetImage = null;
        rotatableImage = null;
        resetScanGuide();
      });
    });

    updateDrawerWheel();
    resetScanGuide();
    retryCameraButton.addEventListener('click', startAR);

    async function startAR() {
      if (!checkCameraSupport()) return;
      retryCameraButton.disabled = true;
      retryCameraButton.textContent = 'Menyalakan kamera...';
      setCameraStatus('Meminta akses kamera dan memulai AR...', 'loading');
      setScanGuidance('Menyiapkan kamera', 'Jika diminta, izinkan akses kamera untuk memulai pemindaian.', true);
      try {
        await scene.systems['mindar-image-system'].start();
      } catch (error) {
        const message = getCameraErrorMessage(error);
        setCameraStatus(message.status, 'error');
        setScanGuidance(message.title, message.description, true);
        retryCameraButton.textContent = 'Coba kamera lagi';
        setTargetIndicator('none');
        console.error('MindAR failed to start:', error);
      } finally {
        retryCameraButton.disabled = false;
        if (retryCameraButton.classList.contains('visible')) {
          retryCameraButton.textContent = 'Coba kamera lagi';
        }
      }
    }

    if (!checkCameraSupport()) {
      setTargetIndicator('none');
      return;
    }
    setCameraStatus('Kamera siap. Tekan tombol untuk memulai pemindaian.');
    setScanGuidance('Siap memindai?', 'Tekan tombol untuk mengaktifkan kamera dan mulai mencari marker.', true);
    }
  </script>
  <script type="module">
    import { getMindFile, getTargets } from './studio-storage.js';

    const scene = document.querySelector('a-scene');
    const syncStatus = document.getElementById('studio-sync-status');

    function addTarget(record, markerUrl, contentUrl) {
      const assets = scene.querySelector('a-assets');
      const markerId = `target-image-${record.target_index}`;
      const contentId = `ar-content-${record.target_index}`;
      const marker = document.createElement('img');
      marker.id = markerId;
      marker.src = markerUrl;
      assets.append(marker);

      const content = document.createElement(record.content_type === 'video' ? 'video' : 'img');
      content.id = contentId;
      content.src = contentUrl;
      if (record.content_type === 'video') {
        content.loop = true;
        content.muted = true;
        content.playsInline = true;
      }
      assets.append(content);

      const target = document.createElement('a-entity');
      target.id = `image-target-${record.target_index}`;
      target.setAttribute('mindar-image-target', `targetIndex: ${record.target_index}`);
      target.dataset.imageId = markerId;
      const wrapper = document.createElement('a-entity');
      wrapper.classList.add('rotatable-image');
      wrapper.dataset.baseZ = String(record.position_z);
      wrapper.setAttribute('position', `${record.position_x} ${record.position_y} ${record.position_z}`);

      [false, true].forEach(backSide => {
        const plane = document.createElement('a-plane');
        plane.setAttribute('src', `#${contentId}`);
        plane.setAttribute('width', String(record.width));
        plane.setAttribute('height', String(record.height));
        plane.setAttribute('material', 'shader: flat');
        if (backSide) {
          plane.setAttribute('rotation', '0 180 0');
          plane.setAttribute('position', '0 0 -0.002');
        }
        wrapper.append(plane);
      });
      target.append(wrapper);
      scene.append(target);
    }

    async function loadStudioTargets() {
      const records = (await getTargets())
        .filter(record => record.enabled)
        .sort((left, right) => left.target_index - right.target_index);
      if (!records.length) {
        syncStatus.textContent = 'Studio lokal kosong; menggunakan katalog bawaan.';
        return;
      }

      const indices = new Set();
      records.forEach(record => {
        if (!Number.isInteger(record.target_index) || record.target_index < 0 || indices.has(record.target_index)) {
          throw new Error('Index target Studio tidak valid atau duplikat.');
        }
        if (!['image', 'video'].includes(record.content_type) || !record.marker_blob || !record.content_blob) {
          throw new Error(`Data karya "${record.title}" tidak lengkap.`);
        }
        indices.add(record.target_index);
      });

      const mindFile = await getMindFile();
      scene.querySelectorAll('[mindar-image-target]').forEach(target => target.remove());
      const assets = scene.querySelector('a-assets');
      assets.querySelectorAll('[id^="target-image-"], [id^="ar-content-"]').forEach(asset => asset.remove());
      scene.setAttribute(
        'mindar-image',
        `imageTargetSrc: ${mindFile?.file ? URL.createObjectURL(mindFile.file) : 'targets.mind'}; autoStart: false; uiScanning: #scanning-overlay;`
      );
      records.forEach(record => addTarget(
        record,
        URL.createObjectURL(record.marker_blob),
        URL.createObjectURL(record.content_blob)
      ));
      syncStatus.textContent = `Studio lokal · ${records.length} karya di browser ini`;
    }

    try {
      await loadStudioTargets();
    } catch (error) {
      syncStatus.textContent = 'Data Studio lokal gagal dimuat. Periksa penyimpanan browser.';
      console.error('Gagal memuat konten Studio:', error);
    }
    await window.initializeAR();
  </script>
