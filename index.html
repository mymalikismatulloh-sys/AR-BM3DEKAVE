<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Visual Feeder AR Business Card</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: white;
      overflow: hidden;
    }

    :root {
      --page-bg: #edf5ff;
      --page-bg-strong: #c8dcf5;
      --panel: linear-gradient(135deg, rgba(255, 255, 255, 0.8), rgba(209, 229, 255, 0.54));
      --panel-strong: linear-gradient(135deg, rgba(255, 255, 255, 0.92), rgba(207, 226, 252, 0.76));
      --panel-border: rgba(255, 255, 255, 0.76);
      --surface: linear-gradient(135deg, rgba(255, 255, 255, 0.68), rgba(191, 216, 250, 0.44));
      --surface-strong: rgba(42, 91, 158, 0.08);
      --text: #10233d;
      --text-soft: rgba(16, 35, 61, 0.72);
      --text-faint: rgba(16, 35, 61, 0.5);
      --accent: #254f88;
      --accent-soft: rgba(55, 112, 190, 0.12);
      --accent-strong: #3978d4;
      --success: #285d9c;
      --danger: #b42318;
      --shadow: 0 18px 48px rgba(35, 76, 130, 0.16);
    }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 16% 6%, rgba(255, 255, 255, 0.94), transparent 35%),
        radial-gradient(ellipse at 86% 18%, rgba(134, 181, 244, 0.4), transparent 38%),
        radial-gradient(ellipse at 54% 100%, rgba(185, 210, 246, 0.5), transparent 44%),
        linear-gradient(145deg, var(--page-bg) 0%, #e1edfc 48%, var(--page-bg-strong) 100%);
      color: var(--text);
      overflow: hidden;
    }

    button, input { font: inherit; }
    button { color: inherit; }
    #app-header {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      z-index: 1250;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px 14px;
      width: min(680px, calc(100vw - 28px));
      padding: 9px 10px 9px 15px;
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: var(--shadow), inset 0 1px rgba(255, 255, 255, .72);
      backdrop-filter: blur(22px) saturate(1.25);
      -webkit-backdrop-filter: blur(22px) saturate(1.25);
      transform: translateX(-50%);
    }

    .brand-lockup, .header-actions, .header-status {
      display: flex;
      align-items: center;
    }

    .brand-lockup { gap: 11px; min-width: 0; }
    .brand-mark {
      color: var(--text);
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -.12em;
      line-height: 1;
      text-shadow: none;
    }
    .brand-name { font-size: 14px; font-weight: 750; letter-spacing: .01em; color: var(--text); }
    .brand-subtitle { display: block; margin-top: 2px; color: var(--text-soft); font-size: 10px; white-space: nowrap; }
    .header-actions { gap: 9px; }
    .header-status { grid-column: 1 / -1; gap: 7px; min-width: 0; }

    #camera-status {
      min-width: 0;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(57, 120, 212, 0.08);
      color: var(--text-soft);
      font-size: 11px;
      text-align: left;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #camera-status.error {
      background: rgba(180, 35, 24, 0.08);
      color: var(--danger);
    }

    #camera-status.ready {
      background: rgba(57, 120, 212, 0.1);
      color: var(--success);
    }

    #camera-status.loading::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 7px;
      border: 2px solid rgba(18, 25, 34, 0.24);
      border-top-color: var(--text);
      border-radius: 50%;
      vertical-align: -1px;
      animation: status-spin 0.8s linear infinite;
    }

    #scanning-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: clamp(128px, 17vh, 154px) 18px 150px;
      background: transparent;
      pointer-events: none;
    }

    #scan-guidance {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      gap: 0;
      width: min(360px, 90vw);
      padding: 11px 15px;
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      background: var(--panel-strong);
      box-shadow: 0 16px 44px rgba(35, 76, 130, 0.15), inset 0 1px rgba(255, 255, 255, 0.82);
      text-align: left;
      backdrop-filter: blur(18px) saturate(1.3);
      -webkit-backdrop-filter: blur(18px) saturate(1.3);
      pointer-events: auto;
      transition: box-shadow .2s ease, border-color .2s ease, background .2s ease;
    }

    #scan-guidance h1 {
      margin: 0 0 3px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    #scan-guidance p {
      margin: 0;
      color: var(--text-soft);
      font-size: 11px;
      line-height: 1.35;
    }

    #retry-camera {
      grid-column: 1 / -1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 210px;
      min-height: 47px;
      margin: 12px auto 0;
      padding: 10px 22px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 999px;
      background: linear-gradient(135deg, #193c6c, #315f9b);
      color: #f8fafc;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(30, 73, 128, 0.24), inset 0 1px rgba(255,255,255,0.2);
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    }

    #retry-camera::before {
      content: "";
      width: 10px;
      height: 10px;
      border: 2px solid currentColor;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.15);
      font-size: 0;
      line-height: 1;
    }
    #retry-camera:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(30, 73, 128, 0.28); }
    #retry-camera:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #retry-camera:not(.visible) {
      display: none;
    }

    #retry-camera.visible {
      display: inline-flex;
    }

    #studio-sync-status {
      max-width: 40vw;
      padding: 5px 8px;
      border: 1px solid rgba(17, 24, 39, 0.08);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.3);
      color: var(--text-soft);
      font-size: 9px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #gallery-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 45px;
      padding: 8px 14px;
      border: 1px solid rgba(17, 24, 39, 0.12);
      border-radius: 16px;
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease;
      box-shadow: inset 0 1px rgba(255,255,255,0.5);
    }

    .gallery-icon { width: 20px; height: 20px; flex: 0 0 auto; }
    #gallery-button:hover { border-color: rgba(57, 120, 212, 0.28); background: rgba(255,255,255,0.72); box-shadow: 0 8px 18px rgba(35, 76, 130, 0.12); }
    #gallery-dock {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 50%;
      z-index: 1250;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) 28px;
      align-items: center;
      gap: 8px;
      width: min(680px, calc(100vw - 30px));
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 24px;
      background: linear-gradient(120deg, rgba(255, 255, 255, 0.8), rgba(187, 214, 249, 0.62));
      box-shadow: 0 16px 38px rgba(35, 76, 130, 0.17), inset 0 1px rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(22px) saturate(1.3);
      -webkit-backdrop-filter: blur(22px) saturate(1.3);
      transform: translateX(-50%);
      transition: box-shadow .2s ease, border-color .2s ease, background .2s ease;
    }

    .dock-arrow, #gallery-dock-handle {
      display: grid;
      place-items: center;
      border: 1px solid rgba(17, 24, 39, 0.08);
      background: rgba(255, 255, 255, 0.34);
      color: var(--text);
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .dock-arrow:hover, #gallery-dock-handle:hover {
      border-color: rgba(57, 120, 212, 0.28);
      background: rgba(255, 255, 255, 0.76);
    }
    .dock-arrow { width: 30px; height: 38px; border-radius: 15px; font-size: 20px; }
    #gallery-thumbnails {
      display: flex;
      gap: 8px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }
    #gallery-thumbnails::-webkit-scrollbar { display: none; }
    .gallery-thumbnail {
      position: relative;
      flex: 0 0 62px;
      width: 62px;
      height: 62px;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
    }
    .gallery-thumbnail img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      object-fit: cover;
      transition: transform .18s ease, opacity .18s ease;
    }
    .gallery-thumbnail:hover img { transform: translateY(-2px); }
    .gallery-thumbnail[aria-current="true"] {
      box-shadow: 0 3px 0 var(--accent-strong);
    }
    .gallery-thumbnail[aria-current="true"] img {
      transform: translateY(-2px);
    }
    #gallery-dock-handle {
      position: absolute;
      top: -19px;
      left: 50%;
      width: 54px;
      height: 22px;
      border-bottom: 0;
      border-radius: 16px 16px 0 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(199, 222, 251, 0.82));
      font-size: 18px;
      transform: translateX(-50%);
    }

    #gallery-dialog {
      width: min(760px, calc(100vw - 24px));
      max-width: none;
      max-height: min(88dvh, 820px);
      padding: 0;
      overflow: hidden;
      border: 1px solid rgba(20, 26, 34, 0.1);
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(248, 252, 255, 0.94), rgba(207, 226, 251, 0.9));
      color: var(--text);
      box-shadow: 0 26px 80px rgba(35, 76, 130, 0.22), inset 0 1px rgba(255,255,255,0.84);
      backdrop-filter: blur(24px) saturate(1.2);
      -webkit-backdrop-filter: blur(24px) saturate(1.2);
      opacity: 0;
      transform: translateY(10px) scale(.99);
      transition: opacity .2s ease, transform .2s ease, display .2s allow-discrete, overlay .2s allow-discrete;
    }

    #gallery-dialog[open] {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    @starting-style {
      #gallery-dialog[open] {
        opacity: 0;
        transform: translateY(10px) scale(.99);
      }
    }

    #gallery-dialog::backdrop {
      background: rgba(18, 25, 34, 0.22);
      backdrop-filter: blur(8px);
    }

    .gallery-content {
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr) auto;
      max-height: min(88dvh, 820px);
      padding: 18px;
    }

    .gallery-grab-handle {
      width: 48px;
      height: 4px;
      margin: -7px auto 14px;
      border-radius: 99px;
      background: rgba(17, 24, 39, 0.18);
    }

    .gallery-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .gallery-heading { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .gallery-heading-icon {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      border-radius: 13px;
      background: rgba(17, 24, 39, 0.04);
      color: var(--text);
    }
    .gallery-header h2 {
      margin: 0 0 3px;
      font-size: 16px;
      color: var(--text);
    }

    .gallery-header p {
      margin: 0;
      color: var(--text-soft);
      font-size: 11px;
      line-height: 1.5;
    }

    #gallery-close {
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(17, 24, 39, 0.1);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.36);
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }
    #gallery-close:hover {
      border-color: rgba(57, 120, 212, 0.28);
      background: rgba(255, 255, 255, 0.78);
      transform: rotate(4deg);
    }

    #gallery-search {
      width: 100%;
      min-height: 44px;
      margin-bottom: 10px;
      padding: 10px 14px;
      border: 1px solid rgba(17, 24, 39, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.42);
      color: var(--text);
      font-size: 12px;
      outline: none;
    }
    #gallery-search::placeholder { color: var(--text-faint); }
    #gallery-search:focus { border-color: rgba(57, 120, 212, 0.5); box-shadow: 0 0 0 3px rgba(57, 120, 212, 0.11); }

    #gallery-search:focus-visible,
    #gallery-close:focus-visible,
    #gallery-list button:focus-visible,
    #gallery-button:focus-visible,
    #gallery-dock button:focus-visible,
    .gallery-filter:focus-visible,
    #gallery-confirm:focus-visible {
      outline: 2px solid rgba(57, 120, 212, 0.5);
      outline-offset: 2px;
    }

    #gallery-filters {
      display: flex;
      gap: 8px;
      margin-bottom: 11px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #gallery-filters::-webkit-scrollbar { display: none; }
    .gallery-filter {
      flex: 0 0 auto;
      min-height: 33px;
      padding: 7px 13px;
      border: 1px solid rgba(17, 24, 39, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
      color: var(--text-soft);
      font-size: 11px;
      cursor: pointer;
      transition: color .18s ease, background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .gallery-filter:hover { transform: translateY(-1px); }
    .gallery-filter[aria-pressed="true"] {
      border-color: rgba(17, 24, 39, 0.12);
      background: linear-gradient(135deg, #28558e, #3978c6);
      color: #f8fafc;
      font-weight: 800;
      box-shadow: none;
    }

    #gallery-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-content: start;
      gap: 10px;
      min-height: 0;
      max-height: 54dvh;
      overflow: auto;
      padding: 1px 3px 4px 0;
      overscroll-behavior: contain;
    }

    .gallery-card {
      position: relative;
      display: grid;
      grid-template-rows: clamp(102px, 28vw, 142px) auto;
      align-content: start;
      min-width: 0;
      min-height: 145px;
      overflow: hidden;
      border: 1px solid rgba(17, 24, 39, 0.08);
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.76), rgba(207, 226, 250, 0.58));
      transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
    }
    .gallery-card:hover { transform: translateY(-2px); }

    .gallery-card[hidden] { display: none; }
    .gallery-card.selected {
      border-color: rgba(57, 120, 212, 0.42);
      box-shadow: 0 0 0 1px rgba(57, 120, 212, 0.3), 0 10px 18px rgba(35, 76, 130, 0.1);
    }

    .gallery-card img {
      display: block;
      width: 100%;
      height: 100%;
      background: rgba(17, 24, 39, 0.02);
      object-fit: contain;
      cursor: pointer;
    }

    .gallery-card h3 {
      margin: 8px 9px 1px;
      overflow: hidden;
      color: var(--text);
      font-size: 11px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .gallery-card button {
      position: absolute;
      top: 9px;
      right: 9px;
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      padding: 0;
      border: 1px solid rgba(17, 24, 39, 0.12);
      border-radius: 50%;
      background: rgba(255,255,255,0.72);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .gallery-card.selected button {
      border-color: rgba(17, 24, 39, 0.12);
      background: linear-gradient(135deg, #28558e, #3978c6);
      color: #f8fafc;
    }

    #gallery-empty {
      grid-column: 1 / -1;
      padding: 28px 12px;
      color: var(--text-soft);
      text-align: center;
    }
    .gallery-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
    }
    .gallery-count { display: grid; gap: 3px; min-width: 0; color: var(--text-soft); font-size: 10px; }
    #gallery-selection-label { max-width: 42vw; overflow: hidden; color: var(--text-faint); text-overflow: ellipsis; white-space: nowrap; }
    #gallery-confirm {
      min-width: 128px;
      min-height: 43px;
      padding: 9px 18px;
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 999px;
      background: linear-gradient(135deg, #3978d4, #28558e);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(35, 76, 130, .24), inset 0 1px rgba(255, 255, 255, .3);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    #gallery-confirm:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 11px 24px rgba(35, 76, 130, .28), inset 0 1px rgba(255, 255, 255, .3);
    }
    #gallery-confirm:disabled { opacity: .48; cursor: not-allowed; box-shadow: none; }

    @media (max-width: 430px) {
      #app-header { width: calc(100vw - 24px); padding: 8px 8px 8px 12px; border-radius: 19px; }
      .brand-mark { font-size: 27px; }
      .brand-lockup { gap: 8px; }
      .header-actions { gap: 5px; }
      #gallery-button { min-height: 40px; padding: 7px 10px; gap: 6px; font-size: 11px; }
      #studio-sync-status { max-width: clamp(92px, 31vw, 150px); font-size: 9px; }
      #camera-status { padding: 5px 9px; font-size: 10px; }
      #scanning-overlay { padding-top: clamp(126px, 15vh, 138px); }
      #scan-guidance { width: min(340px, calc(100vw - 46px)); }
      #gallery-dialog { width: calc(100vw - 22px); max-height: min(88dvh, 820px); border-radius: 25px; }
      .gallery-content { max-height: min(88dvh, 820px); padding: 15px; }
      #gallery-list { gap: 8px; max-height: 55dvh; }
      .gallery-card { grid-template-rows: clamp(96px, 29vw, 126px) auto; }
      .gallery-card h3 { margin: 7px 8px 9px; font-size: 10px; }
      .gallery-card button { top: 7px; right: 7px; }
      #gallery-dock { width: calc(100vw - 34px); grid-template-columns: 25px minmax(0, 1fr) 25px; gap: 6px; padding: 8px; }
      .gallery-thumbnail { flex-basis: 54px; width: 54px; height: 54px; }
      .dock-arrow { width: 27px; height: 36px; }
      #rotation-controller { transform: scale(.88); transform-origin: bottom right; }
    }

    @media (max-height: 640px) {
      #gallery-dialog, .gallery-content { max-height: 92dvh; }
      #gallery-list { max-height: 46dvh; }
      #gallery-dock { bottom: max(10px, env(safe-area-inset-bottom)); }
      #scanning-overlay { padding-top: clamp(112px, 16vh, 132px); }
    }

    #target-indicator {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1100;
      pointer-events: none;
      display: none;
    }

    #target-indicator polygon {
      fill: rgba(17, 24, 39, 0.02);
      stroke: rgba(45, 99, 166, 0.82);
      stroke-width: 4;
      vector-effect: non-scaling-stroke;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 8px rgba(45, 99, 166, 0.2));
    }

    #target-indicator.active {
      display: block;
    }

    #target-indicator.active polygon {
      fill: rgba(57, 120, 212, 0.08);
      stroke: rgba(45, 99, 166, 0.92);
      filter: drop-shadow(0 0 9px rgba(57, 120, 212, 0.22));
    }

    #target-indicator.inactive {
      display: block;
      animation: guide-pulse 1.6s ease-in-out infinite alternate;
    }
    #rotation-controller {
      position: fixed;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(96px, calc(env(safe-area-inset-bottom) + 82px));
      z-index: 1250;
      display: none;
      grid-template-columns: minmax(0, 1fr);
      gap: 7px;
      width: min(230px, calc(100vw - 28px));
      padding: 10px;
      border: 1px solid rgba(57, 120, 212, 0.18);
      border-radius: 18px;
      background: var(--panel-strong);
      box-shadow: 0 14px 30px rgba(35, 76, 130, 0.15);
      backdrop-filter: blur(12px);
    }

    #rotation-controller.visible {
      display: grid;
    }

    #rotation-drawer-toggle,
    #toggle-drawer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 38px;
      padding: 0 11px !important;
      border-radius: 11px !important;
      font-size: 11px !important;
      font-weight: 700;
      text-align: left;
    }

    #rotation-drawer-toggle::after,
    #toggle-drawer::after {
      content: "⌄";
      color: var(--text-soft);
      font-size: 17px;
      transition: transform .18s ease;
    }

    #rotation-drawer-toggle[aria-expanded="true"]::after,
    #toggle-drawer[aria-expanded="true"]::after {
      transform: rotate(180deg);
    }

    #rotation-drawer-content {
      display: grid;
      gap: 8px;
    }

    #rotation-drawer-content[hidden] {
      display: none;
    }

    #rotation-drawer-content #pose-mode-controls {
      grid-column: auto;
    }

    #rotation-pad {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: center;
      justify-items: center;
      gap: 6px;
    }

    #rotation-pad > button {
      width: 100%;
      max-width: 46px;
    }

    #rotation-pad > span {
      width: 100%;
      height: 1px;
    }

    #rotation-controller #parallax-toggle {
      grid-column: auto;
      width: 100% !important;
    }

    #rotation-controller > button,
    #controller-drawer button {
      width: 100%;
    }

    #controller-drawer[hidden],
    #social-links[hidden] {
      display: none;
    }

    #rotation-controller button {
      height: 42px;
      padding: 0;
      border: 1px solid rgba(57, 120, 212, 0.16);
      border-radius: 12px;
      background: rgba(57, 120, 212, 0.07);
      color: var(--text);
      font-size: 20px;
      touch-action: manipulation;
    }

    #rotation-controller button:active,
    #rotation-controller button:focus-visible {
      outline: 2px solid rgba(57, 120, 212, 0.35);
      outline-offset: 2px;
      background: rgba(57, 120, 212, 0.14);
    }

    #rotation-controller [data-axis="x"] {
      color: var(--text-soft);
      font-size: 11px;
      font-weight: 700;
    }

    #pose-mode-controls {
      display: grid;
      gap: 5px;
      width: 100%;
    }

    #pose-mode-controls h3 {
      margin: 0;
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      text-align: center;
    }

    #pose-mode-buttons {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
    }

    #pose-mode-buttons button {
      width: 100%;
      height: 34px;
      padding: 0 3px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 700;
    }

    #pose-mode-buttons button[aria-pressed="true"] {
      border-color: rgba(57, 120, 212, 0.58);
      background: linear-gradient(135deg, #3978d4, #28558e);
      color: #fff;
      box-shadow: 0 5px 14px rgba(35, 76, 130, 0.2);
    }

    #toggle-drawer {
      width: 100%;
    }

    #controller-drawer {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      width: 100%;
    }

    #controller-drawer button {
      height: auto;
      min-height: 39px;
      padding: 7px 8px;
      border-radius: 10px;
      font-size: 10px;
      line-height: 1.25;
      text-shadow: none;
    }

    #social-links {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    #social-links a {
      display: block;
      padding: 10px 8px;
      border: 1px solid rgba(91, 203, 255, 0.65);
      border-radius: 10px;
      background: rgba(0, 30, 74, 0.78);
      color: white;
      font-size: 10px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }

    #social-links a:focus-visible {
      outline: 2px solid rgba(177, 238, 255, 0.95);
      outline-offset: 2px;
    }

    #parallax-toggle[aria-pressed="true"] {
      border-color: rgba(57, 120, 212, 0.58) !important;
      background: linear-gradient(135deg, #3978d4, #28558e) !important;
    }

    #parallax-toggle {
      min-height: 38px !important;
      padding: 7px 10px !important;
      font-size: 12px !important;
      font-weight: 700;
      white-space: nowrap;
    }

    #controller-drawer button:active,
    #controller-drawer button:focus-visible,
    #rotation-drawer-toggle:focus-visible,
    #toggle-drawer:focus-visible {
      outline: 2px solid rgba(177, 238, 255, 0.95);
      outline-offset: 2px;
    }

    #rotation-drawer-content {
      min-width: 0;
    }

    #gesture-hint {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 1250;
      width: max-content;
      max-width: 88vw;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.78);
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      pointer-events: none;
    }

    #gesture-hint.visible {
      opacity: 1;
      visibility: visible;
    }

    @keyframes guide-pulse {
      from { opacity: 0.48; }
      to { opacity: 1; }
    }

    @keyframes status-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      #camera-status.loading::before,
      #target-indicator.inactive {
        animation: none;
      }
    }
  </style>
</head>
<body>

  <header id="app-header">
    <div class="brand-lockup" aria-label="AR Scan 2.5D Parallax">
      <span class="brand-mark" aria-hidden="true">AR</span>
      <span>
        <span class="brand-name">AR Scan</span>
        <span class="brand-subtitle">2.5D Parallax</span>
      </span>
    </div>
    <div class="header-actions">
      <div id="studio-sync-status" role="status" aria-live="polite">Memeriksa katalog...</div>
      <button id="gallery-button" type="button" aria-haspopup="dialog" aria-controls="gallery-dialog">
        <svg class="gallery-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9M4 8h13M7 4v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="m3.5 18 5.2-5.3 3.2 3.1 2.3-2.2 6.3 6H5a1.5 1.5 0 0 1-1.5-1.6Z" fill="currentColor" fill-opacity=".18" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        Galeri
      </button>
    </div>
    <div class="header-status">
      <div id="camera-status" class="loading" role="status" aria-live="polite">Memeriksa kamera...</div>
    </div>
  </header>
  <dialog id="gallery-dialog" aria-labelledby="gallery-title">
    <div class="gallery-content">
      <div class="gallery-grab-handle" aria-hidden="true"></div>
      <header class="gallery-header">
        <div class="gallery-heading">
          <span class="gallery-heading-icon" aria-hidden="true">
            <svg class="gallery-icon" viewBox="0 0 24 24" fill="none">
              <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9M4 8h13M7 4v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="m3.5 18 5.2-5.3 3.2 3.1 2.3-2.2 6.3 6H5a1.5 1.5 0 0 1-1.5-1.6Z" fill="currentColor" fill-opacity=".18" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            </svg>
          </span>
          <span>
            <h2 id="gallery-title">Galeri Marker</h2>
            <p id="gallery-description">Memuat daftar marker yang tersedia...</p>
          </span>
        </div>
        <button id="gallery-close" type="button" aria-label="Tutup galeri">×</button>
      </header>
      <input id="gallery-search" type="search" placeholder="Cari gambar..." aria-label="Cari gambar di galeri">
      <nav id="gallery-filters" aria-label="Filter kelompok marker">
        <button class="gallery-filter" type="button" data-range="all" aria-pressed="true">Semua</button>
        <button class="gallery-filter" type="button" data-range="0-9" aria-pressed="false">00–09</button>
        <button class="gallery-filter" type="button" data-range="10-19" aria-pressed="false">10–19</button>
        <button class="gallery-filter" type="button" data-range="20-999" aria-pressed="false">20+</button>
      </nav>
      <div id="gallery-list" aria-live="polite">
        <p id="gallery-empty">Memuat gambar...</p>
      </div>
      <footer class="gallery-footer">
        <span class="gallery-count">
          <span id="gallery-total">0 gambar</span>
          <span id="gallery-selection-label">Pilih gambar</span>
        </span>
        <button id="gallery-confirm" type="button" disabled>Pilih</button>
      </footer>
    </div>
  </dialog>
  <nav id="gallery-dock" aria-label="Pilihan cepat gambar">
    <button class="dock-arrow" id="gallery-dock-previous" type="button" aria-label="Gambar sebelumnya">‹</button>
    <div id="gallery-thumbnails"></div>
    <button class="dock-arrow" id="gallery-dock-next" type="button" aria-label="Gambar berikutnya">›</button>
    <button id="gallery-dock-handle" type="button" aria-label="Buka galeri lengkap">⌃</button>
  </nav>
  <svg id="target-indicator" class="inactive" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">
    <polygon id="target-indicator-shape" points="0,0 0,0 0,0 0,0"></polygon>
  </svg>
  <div id="gesture-hint" role="status" aria-live="polite"></div>
  <section id="rotation-controller" aria-label="Kontrol karya AR" aria-hidden="true">
    <button id="rotation-drawer-toggle" type="button" aria-expanded="false" aria-controls="rotation-drawer-content">Sudut & Rotasi</button>
    <div id="rotation-drawer-content" hidden>
      <div id="pose-mode-controls">
        <h3>Mode sudut</h3>
        <div id="pose-mode-buttons" role="group" aria-label="Pilih mode sudut karya">
          <button type="button" data-pose-mode="attached" aria-pressed="true">Tempel</button>
          <button type="button" data-pose-mode="angle" aria-pressed="false">45°</button>
          <button type="button" data-pose-mode="free" aria-pressed="false">Bebas</button>
        </div>
      </div>
      <div id="rotation-pad" role="group" aria-label="Putar karya">
        <span aria-hidden="true"></span>
        <button type="button" data-axis="x" data-step="-15" aria-label="Putar ke atas 15 derajat">↑</button>
        <span aria-hidden="true"></span>
        <button type="button" data-axis="y" data-step="-15" aria-label="Putar ke kiri 15 derajat">←</button>
        <button type="button" data-axis="x" data-step="15" aria-label="Putar ke bawah 15 derajat">↓</button>
        <button type="button" data-axis="y" data-step="15" aria-label="Putar ke kanan 15 derajat">→</button>
      </div>
      <button id="parallax-toggle" type="button" aria-pressed="false">Visual: Normal</button>
    </div>
    <button id="toggle-drawer" type="button" aria-expanded="false" aria-controls="controller-drawer">Alat lainnya</button>
    <div id="controller-drawer" hidden>
      <button id="drawer-reset" type="button">Atur ulang</button>
      <button id="drawer-toggle-image" type="button">Sembunyikan gambar</button>
      <button id="drawer-toggle-links" type="button" aria-expanded="false" aria-controls="social-links">Tautan sekolah</button>
      <nav id="social-links" aria-label="Tautan sekolah" hidden>
        <a href="https://smkbinamandirimultimedia.sch.id/" target="_blank" rel="noopener noreferrer">Website</a>
        <a href="https://www.instagram.com/smkbm_3/" target="_blank" rel="noopener noreferrer">Instagram</a>
      </nav>
    </div>
  </section>
  <!-- Ganti imageTargetSrc dengan file .mind Anda -->
  <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: false; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 10; uiScanning: #scanning-overlay;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets></a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>

  <div id="scanning-overlay" aria-live="polite">
    <section id="scan-guidance">
      <h1 id="scan-guidance-title">Siap memindai?</h1>
      <p id="scan-guidance-description">Tekan mulai, lalu arahkan kamera perlahan ke gambar yang rata, terang, dan terlihat utuh.</p>
      <button id="retry-camera" class="visible" type="button">Mulai pemindaian</button>
    </section>
  </div>

  <script>
    async function initializeAR() {
    const scene = document.querySelector('a-scene');
    const cameraStatus = document.getElementById('camera-status');
    const scanGuidanceTitle = document.getElementById('scan-guidance-title');
    const scanGuidanceDescription = document.getElementById('scan-guidance-description');
    const retryCameraButton = document.getElementById('retry-camera');
    const targetIndicator = document.getElementById('target-indicator');
    const targetIndicatorShape = document.getElementById('target-indicator-shape');
    const gestureHint = document.getElementById('gesture-hint');
    const rotationController = document.getElementById('rotation-controller');
    const rotationDrawerButton = document.getElementById('rotation-drawer-toggle');
    const rotationDrawer = document.getElementById('rotation-drawer-content');
    const parallaxToggle = document.getElementById('parallax-toggle');
    const poseModeButtons = document.getElementById('pose-mode-buttons');
    const drawerButton = document.getElementById('toggle-drawer');
    const controllerDrawer = document.getElementById('controller-drawer');
    const resetButton = document.getElementById('drawer-reset');
    const toggleButton = document.getElementById('drawer-toggle-image');
    const linksButton = document.getElementById('drawer-toggle-links');
    const galleryButton = document.getElementById('gallery-button');
    const galleryDialog = document.getElementById('gallery-dialog');
    const galleryList = document.getElementById('gallery-list');
    const gallerySearch = document.getElementById('gallery-search');
    const galleryConfirm = document.getElementById('gallery-confirm');
    const galleryFilters = document.getElementById('gallery-filters');
    const galleryThumbnails = document.getElementById('gallery-thumbnails');
    let scannerStarted = false;
    let scannerStarting = false;
    let requestedTargetName = '';
    let selectedTargetIndex = null;
    let targets = [];
    let activeTarget = null;
    let activeTargetImage = null;
    let rotatableImage = null;
    let targetVisible = false;
    let imageEnabled = true;
    let poseMode = 'attached';
    let configuredPoseZ = 0.65;
    let poseTransitionFrame = null;
    let parallaxEnabled = false;
    let activeParallaxPlanes = [];
    let activeParallaxProfile = null;
    let parallaxPermissionRequested = false;
    let parallaxAnimationFrame = null;
    let parallaxInputX = 0;
    let parallaxInputY = 0;
    let parallaxCurrentX = 0;
    let parallaxCurrentY = 0;
    let activePointer = null;
    let previousPointerX = 0;
    let previousPointerY = 0;
    let gestureHintTimeout = null;
    let animationFrame = null;
    let guideAnimationFrame = null;
    let guideHideTimeout = null;
    let scanGuidanceTimer = null;
    const activePointers = new Map();
    let pinchStartDistance = 0;
    let pinchStartScale = 1;
    const SCAN_GUIDE_VISIBLE_MS = 1200;
    const PARALLAX_SMOOTHING = 0.12;
    const ADAPTIVE_SCAN_GUIDANCE = [
      {
        delay: 6000,
        title: 'Dekatkan kamera ke marker',
        description: 'Belum terbaca? Dekatkan kamera sampai gambar memenuhi sebagian besar layar, lalu tahan HP tetap stabil.'
      },
      {
        delay: 7000,
        title: 'Periksa cahaya dan pantulan',
        description: 'Pastikan marker terang merata dan tidak tertutup bayangan. Ubah sedikit arah kamera jika permukaan memantulkan cahaya.'
      },
      {
        delay: 10000,
        title: 'Coba gerakkan kamera perlahan',
        description: 'Jaga seluruh marker tetap terlihat dan tunggu fokus kamera. Jika perlu, mundurkan sedikit kamera lalu arahkan kembali.'
      }
    ];
    const POSE_MODES = {
      attached: { label: 'Tempel', rotationX: 0 },
      angle: { label: '45°', rotationX: -Math.PI / 4 },
      free: { label: 'Bebas', rotationX: 0 }
    };

    function setCameraStatus(message, type = '') {
      cameraStatus.textContent = message;
      cameraStatus.classList.remove('error', 'ready', 'loading');
      if (type) cameraStatus.classList.add(type);
    }

    function setScanGuidance(title, description, retry = false) {
      scanGuidanceTitle.textContent = title;
      scanGuidanceDescription.textContent = description;
      retryCameraButton.classList.toggle('visible', retry);
    }

    function setSelectedGalleryTarget(targetIndex) {
      const target = document.getElementById(`image-target-${targetIndex}`);
      if (!target) {
        console.error(`Marker index ${targetIndex} tidak ditemukan di scene AR.`);
        return false;
      }
      selectedTargetIndex = Number(targetIndex);
      galleryList.querySelectorAll('.gallery-card').forEach(card => {
        const selected = Number(card.dataset.targetIndex) === selectedTargetIndex;
        card.classList.toggle('selected', selected);
        const button = card.querySelector('button[data-target-index]');
        if (button) {
          button.textContent = selected ? '✓' : '＋';
          button.setAttribute('aria-label', `${selected ? 'Terpilih' : 'Pilih'} ${card.dataset.searchText}`);
          button.setAttribute('aria-pressed', String(selected));
        }
      });
      galleryThumbnails.querySelectorAll('.gallery-thumbnail').forEach(button => {
        const selected = Number(button.dataset.targetIndex) === selectedTargetIndex;
        button.setAttribute('aria-current', String(selected));
      });
      const visibleCount = Array.from(galleryList.querySelectorAll('.gallery-card'))
        .filter(card => !card.hidden).length;
      document.getElementById('gallery-total').textContent = `${visibleCount} gambar`;
      document.getElementById('gallery-selection-label').textContent = target.dataset.targetName || 'Marker terpilih';
      galleryConfirm.disabled = false;
      return true;
    }

    function chooseGalleryTarget(targetIndex) {
      if (!setSelectedGalleryTarget(targetIndex)) return;
      const target = document.getElementById(`image-target-${targetIndex}`);
      requestedTargetName = target.dataset.targetName || 'marker pilihan';
      galleryDialog.close();
      const overlay = document.getElementById('scanning-overlay');
      if (overlay) overlay.style.display = 'flex';
      setCameraStatus(scannerStarted ? `Mencari: ${requestedTargetName}` : 'Kamera siap untuk memindai.', 'ready');
      setScanGuidance(`Pindai: ${requestedTargetName}`, 'Arahkan kamera ke gambar yang dipilih, tampilkan seluruh marker, lalu tahan kamera tetap stabil.');
      if (!scannerStarted && !scannerStarting) startAR(requestedTargetName);
    }

    function filterGallery() {
      const query = gallerySearch.value.trim().toLocaleLowerCase('id');
      const activeFilter = galleryFilters.querySelector('[aria-pressed="true"]');
      const range = activeFilter?.dataset.range || 'all';
      const [minimum, maximum] = range === 'all' ? [0, Infinity] : range.split('-').map(Number);
      let visibleCount = 0;
      galleryList.querySelectorAll('.gallery-card').forEach(card => {
        const index = Number(card.dataset.targetIndex);
        const matches = card.dataset.searchText.includes(query) && index >= minimum && index <= maximum;
        card.hidden = !matches;
        if (matches) visibleCount += 1;
      });
      const empty = galleryList.querySelector('#gallery-empty');
      if (empty) {
        empty.textContent = visibleCount ? '' : 'Tidak ada gambar yang cocok dengan pilihan ini.';
        empty.hidden = visibleCount > 0;
      }
      document.getElementById('gallery-total').textContent = `${visibleCount} gambar`;
    }

    function stopAdaptiveScanGuidance() {
      window.clearTimeout(scanGuidanceTimer);
      scanGuidanceTimer = null;
    }

    function startAdaptiveScanGuidance() {
      stopAdaptiveScanGuidance();
      let step = 0;

      function showNextTip() {
        if (targetVisible || step >= ADAPTIVE_SCAN_GUIDANCE.length) return;
        const tip = ADAPTIVE_SCAN_GUIDANCE[step++];
        scanGuidanceTimer = window.setTimeout(() => {
          scanGuidanceTimer = null;
          if (targetVisible) return;
          setScanGuidance(tip.title, tip.description);
          showNextTip();
        }, tip.delay);
      }

      showNextTip();
    }

    function setTargetIndicator(state) {
      targetIndicator.classList.remove('active', 'inactive');
      if (state === 'active') {
        targetIndicator.classList.add('active');
      } else if (state === 'inactive') {
        targetIndicator.classList.add('inactive');
        targetIndicator.style.display = 'block';
      } else {
        targetIndicator.style.display = 'none';
      }
    }

    function setGuidePoints(points) {
      targetIndicatorShape.setAttribute(
        'points',
        points.map(point => `${point.x},${point.y}`).join(' ')
      );
    }

    function getSmallGuidePoints() {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const size = Math.min(288, window.innerWidth * 0.72, window.innerHeight * 0.34);
      const half = size / 2;
      return [
        { x: centerX - half, y: centerY - half },
        { x: centerX + half, y: centerY - half },
        { x: centerX + half, y: centerY + half },
        { x: centerX - half, y: centerY + half }
      ];
    }

    function getTargetScreenPoints() {
      if (!scene.camera || !activeTarget || !activeTargetImage) return null;
      scene.object3D.updateMatrixWorld(true);
      scene.camera.updateMatrixWorld(true);
      const halfHeight = activeTargetImage.naturalHeight / activeTargetImage.naturalWidth / 2;
      const corners = [
        [-0.5, -halfHeight, 0],
        [0.5, -halfHeight, 0],
        [0.5, halfHeight, 0],
        [-0.5, halfHeight, 0]
      ];
      const points = corners.map(([x, y, z]) => {
        const point = activeTarget.object3D.localToWorld(new THREE.Vector3(x, y, z));
        point.project(scene.camera);
        return {
          x: (point.x + 1) * 0.5 * window.innerWidth,
          y: (1 - point.y) * 0.5 * window.innerHeight
        };
      });
      return points.every(point => Number.isFinite(point.x) && Number.isFinite(point.y))
        ? points
        : null;
    }

    function resetScanGuide() {
      window.clearTimeout(guideHideTimeout);
      if (guideAnimationFrame !== null) {
        window.cancelAnimationFrame(guideAnimationFrame);
        guideAnimationFrame = null;
      }
      targetIndicator.setAttribute('viewBox', `0 0 ${window.innerWidth} ${window.innerHeight}`);
      setGuidePoints(getSmallGuidePoints());
      setTargetIndicator('inactive');
    }

    function animateScanGuideToTarget() {
      window.clearTimeout(guideHideTimeout);
      if (guideAnimationFrame !== null) window.cancelAnimationFrame(guideAnimationFrame);
      const startPoints = getSmallGuidePoints();
      const startTime = performance.now();
      const duration = 420;

      function animate(now) {
        if (!targetVisible) {
          guideAnimationFrame = null;
          return;
        }
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const currentTargetPoints = getTargetScreenPoints();
        if (currentTargetPoints) {
          setGuidePoints(progress < 1
            ? startPoints.map((point, index) => ({
              x: point.x + (currentTargetPoints[index].x - point.x) * eased,
              y: point.y + (currentTargetPoints[index].y - point.y) * eased
            }))
            : currentTargetPoints);
        }
        if (elapsed >= SCAN_GUIDE_VISIBLE_MS) {
          setTargetIndicator('none');
          guideAnimationFrame = null;
          return;
        }
        guideAnimationFrame = window.requestAnimationFrame(animate);
      }

      setTargetIndicator('active');
      targetIndicator.setAttribute('viewBox', `0 0 ${window.innerWidth} ${window.innerHeight}`);
      guideAnimationFrame = window.requestAnimationFrame(animate);
      guideHideTimeout = window.setTimeout(() => {
        if (targetVisible) setTargetIndicator('none');
        if (guideAnimationFrame !== null) {
          window.cancelAnimationFrame(guideAnimationFrame);
          guideAnimationFrame = null;
        }
      }, SCAN_GUIDE_VISIBLE_MS);
    }

    function updateImageVisibility() {
      rotatableImage.object3D.visible = targetVisible && imageEnabled;
      rotationController.classList.toggle('visible', targetVisible && imageEnabled);
      rotationController.setAttribute('aria-hidden', String(!targetVisible || !imageEnabled));
      toggleButton.textContent = imageEnabled ? 'Sembunyikan gambar' : 'Tampilkan gambar';
    }

    function setPoseMode(mode, { animate = true, showHint = true } = {}) {
      const preset = POSE_MODES[mode];
      if (!preset || !rotatableImage) return;

      poseMode = mode;
      const plane = rotatableImage.querySelector('.ar-content-plane');
      const planeHeight = Number(plane?.getAttribute('height'));
      const tiltLift = Number.isFinite(planeHeight)
        ? planeHeight * Math.sin(Math.abs(preset.rotationX)) / 2
        : 0;
      const endZ = mode === 'angle'
        ? Math.max(configuredPoseZ, tiltLift + 0.02)
        : configuredPoseZ;
      poseModeButtons.querySelectorAll('[data-pose-mode]').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.poseMode === mode));
      });

      if (poseTransitionFrame !== null) {
        window.cancelAnimationFrame(poseTransitionFrame);
        poseTransitionFrame = null;
      }
      if (animationFrame !== null) {
        window.cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }

      const object = rotatableImage.object3D;
      if (!animate) {
        object.position.z = endZ;
        object.rotation.set(preset.rotationX, 0, 0);
        return;
      }

      object.scale.setScalar(1);
      const startZ = object.position.z;
      const startRotation = object.rotation.toArray();
      const endRotation = [preset.rotationX, 0, 0];
      const startTime = performance.now();
      const duration = 320;

      function transition(now) {
        if (!targetVisible || !rotatableImage) {
          poseTransitionFrame = null;
          return;
        }
        const progress = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        object.position.z = startZ + (endZ - startZ) * eased;
        object.rotation.set(
          startRotation[0] + (endRotation[0] - startRotation[0]) * eased,
          startRotation[1] + (endRotation[1] - startRotation[1]) * eased,
          startRotation[2] + (endRotation[2] - startRotation[2]) * eased
        );
        if (progress < 1) {
          poseTransitionFrame = window.requestAnimationFrame(transition);
        } else {
          poseTransitionFrame = null;
        }
      }

      poseTransitionFrame = window.requestAnimationFrame(transition);
      if (showHint) {
        showGestureHint(
          mode === 'free'
            ? 'Mode Bebas: seret karya atau gunakan tombol rotasi.'
            : `Mode ${preset.label}: posisi karya disesuaikan.`
        );
      }
    }

    function setParallaxOffset(horizontal, vertical) {
      if (!parallaxEnabled) return;
      parallaxInputX = Math.max(-1, Math.min(1, horizontal));
      parallaxInputY = Math.max(-1, Math.min(1, vertical));
    }

    function resetParallaxPlanes() {
      activeParallaxPlanes.forEach(({ object, basePosition, baseRotation }) => {
        object.position.copy(basePosition);
        object.rotation.copy(baseRotation);
      });
      parallaxInputX = 0;
      parallaxInputY = 0;
      parallaxCurrentX = 0;
      parallaxCurrentY = 0;
    }

    function animateParallax(now) {
      parallaxAnimationFrame = null;
      if (!parallaxEnabled || !targetVisible || !activeParallaxPlanes.length || !activeParallaxProfile) return;

      parallaxCurrentX += (parallaxInputX - parallaxCurrentX) * PARALLAX_SMOOTHING;
      parallaxCurrentY += (parallaxInputY - parallaxCurrentY) * PARALLAX_SMOOTHING;
      activeParallaxPlanes.forEach(({ object, basePosition, baseRotation }) => {
        object.position.copy(basePosition);
        object.position.x += parallaxCurrentX * activeParallaxProfile.shiftX;
        object.position.y -= parallaxCurrentY * activeParallaxProfile.shiftY;
        object.rotation.copy(baseRotation);
        object.rotation.x += parallaxCurrentY * activeParallaxProfile.tilt;
        object.rotation.y += parallaxCurrentX * activeParallaxProfile.tilt;
      });
      parallaxAnimationFrame = window.requestAnimationFrame(animateParallax);
    }

    function handleDeviceOrientation(event) {
      if (typeof event.gamma !== 'number' || typeof event.beta !== 'number') return;
      setParallaxOffset(
        Math.max(-1, Math.min(1, event.gamma / 35)),
        Math.max(-1, Math.min(1, (event.beta - 45) / 35))
      );
    }

    async function toggleParallax() {
      if (!targetVisible || !imageEnabled) return;
      const enabling = !parallaxEnabled;
      if (enabling && !parallaxPermissionRequested) {
        parallaxPermissionRequested = true;
        const orientation = window.DeviceOrientationEvent;
        if (typeof orientation?.requestPermission === 'function') {
          try {
            const permission = await orientation.requestPermission();
            if (permission !== 'granted') {
              showGestureHint('Izin sensor gerak ditolak. Parallax dapat dicoba dengan menggerakkan pointer.');
            }
          } catch (error) {
            console.warn('Izin sensor gerak tidak tersedia:', error);
            showGestureHint('Sensor gerak tidak tersedia. Parallax dapat dicoba dengan menggerakkan pointer.');
          }
        }
      }
      parallaxEnabled = enabling;
      parallaxToggle.setAttribute('aria-pressed', String(parallaxEnabled));
      parallaxToggle.textContent = parallaxEnabled ? 'Visual: Parallax' : 'Visual: Normal';
      if (parallaxEnabled) {
        window.addEventListener('deviceorientation', handleDeviceOrientation);
        setParallaxOffset(0, 0);
        if (parallaxAnimationFrame !== null) {
          window.cancelAnimationFrame(parallaxAnimationFrame);
        }
        parallaxAnimationFrame = window.requestAnimationFrame(animateParallax);
        showGestureHint('Parallax khusus karya aktif: miringkan HP atau gerakkan pointer.');
      } else {
        window.removeEventListener('deviceorientation', handleDeviceOrientation);
        if (parallaxAnimationFrame !== null) {
          window.cancelAnimationFrame(parallaxAnimationFrame);
          parallaxAnimationFrame = null;
        }
        resetParallaxPlanes();
        showGestureHint('Parallax dimatikan. Karya kembali ke posisi normal.');
      }
      updateImageVisibility();
    }

    function closeDrawer() {
      controllerDrawer.hidden = true;
      drawerButton.setAttribute('aria-expanded', 'false');
      rotationDrawer.hidden = true;
      rotationDrawerButton.setAttribute('aria-expanded', 'false');
      document.getElementById('social-links').hidden = true;
      linksButton.setAttribute('aria-expanded', 'false');
    }

    function showGestureHint(message, fadeDelay = 5000) {
      window.clearTimeout(gestureHintTimeout);
      gestureHint.textContent = message;
      gestureHint.classList.add('visible');
      gestureHintTimeout = window.setTimeout(() => {
        gestureHint.classList.remove('visible');
      }, fadeDelay);
    }

    function animateImageIn() {
      if (animationFrame !== null) window.cancelAnimationFrame(animationFrame);

      const duration = 450;
      const startTime = performance.now();
      const endZ = Number(rotatableImage.dataset.baseZ || 0.65);
      const startZ = Math.max(0, endZ - 0.25);
      rotatableImage.object3D.position.z = startZ;
      rotatableImage.object3D.scale.setScalar(0.82);

      function animate(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        rotatableImage.object3D.position.z = startZ + (endZ - startZ) * eased;
        rotatableImage.object3D.scale.setScalar(0.82 + 0.18 * eased);
        if (progress < 1 && targetVisible && imageEnabled) {
          animationFrame = window.requestAnimationFrame(animate);
        } else {
          animationFrame = null;
        }
      }

      animationFrame = window.requestAnimationFrame(animate);
    }

    function getPointerDistance() {
      const points = Array.from(activePointers.values());
      if (points.length < 2) return 0;
      return Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
    }

    function checkCameraSupport() {
      if (!window.isSecureContext) {
        setCameraStatus('Kamera memerlukan HTTPS atau localhost.', 'error');
        setScanGuidance('Koneksi belum aman', 'Buka aplikasi melalui HTTPS atau http://localhost untuk menggunakan kamera.');
        retryCameraButton.classList.remove('visible');
        return false;
      }
      if (!navigator.mediaDevices?.getUserMedia) {
        setCameraStatus('Browser ini tidak mendukung akses kamera.', 'error');
        setScanGuidance('Kamera tidak didukung', 'Buka halaman ini menggunakan browser modern yang mendukung kamera.');
        retryCameraButton.classList.remove('visible');
        return false;
      }
      return true;
    }

    function getCameraErrorMessage(error) {
      const detail = error?.detail?.error || error?.error || error;
      const name = detail?.name || detail?.message || detail;
      if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
        return {
          status: 'Izin kamera ditolak. Izinkan akses kamera untuk situs ini.',
          title: 'Izin kamera diperlukan',
          description: 'Izinkan penggunaan kamera pada pengaturan situs, lalu coba lagi.'
        };
      }
      if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
        return {
          status: 'Kamera tidak ditemukan pada perangkat ini.',
          title: 'Kamera tidak ditemukan',
          description: 'Pastikan perangkat memiliki kamera dan tidak sedang dinonaktifkan.'
        };
      }
      if (name === 'NotReadableError' || name === 'TrackStartError') {
        return {
          status: 'Kamera sedang digunakan aplikasi lain.',
          title: 'Kamera sedang digunakan',
          description: 'Tutup aplikasi lain yang memakai kamera, lalu coba lagi.'
        };
      }
      if (name === 'OverconstrainedError' || name === 'ConstraintNotSatisfiedError') {
        return {
          status: 'Kamera tidak mendukung pengaturan yang diminta.',
          title: 'Kamera tidak cocok',
          description: 'Coba gunakan kamera atau perangkat lain.'
        };
      }
      return {
        status: 'AR gagal dimulai. Periksa kamera, izin situs, dan file marker.',
        title: 'Kamera AR gagal dimulai',
        description: 'Pastikan kamera tersedia, izin diberikan, dan file targets.mind dapat dimuat.'
      };
    }

    function setupRotationControls() {
      if (setupRotationControls.initialized) return;
      setupRotationControls.initialized = true;
      const canvas = scene.canvas;

      canvas.style.touchAction = 'none';
      if (canvas.parentElement) canvas.parentElement.style.touchAction = 'none';

      document.addEventListener('pointerdown', event => {
        if (!targetVisible || !imageEnabled ||
            (event.target instanceof Element && event.target.closest('#rotation-controller'))) return;
        if (!(event.target instanceof Node) || !canvas.contains(event.target)) return;

        activePointers.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY,
          type: event.pointerType
        });
        if (canvas.setPointerCapture && event.pointerId >= 0) {
          try {
            canvas.setPointerCapture(event.pointerId);
          } catch (error) {
            console.warn('Pointer capture tidak tersedia untuk gesture AR:', error);
          }
        }
        event.preventDefault();

        if (activePointers.size === 1) {
          activePointer = event.pointerId;
          previousPointerX = event.clientX;
          previousPointerY = event.clientY;
        } else if (activePointers.size === 2 && event.pointerType === 'touch') {
          activePointer = null;
          pinchStartDistance = getPointerDistance();
          pinchStartScale = rotatableImage.object3D.scale.x;
        }
      });

      document.addEventListener('pointermove', event => {
        if (!activePointers.has(event.pointerId) || !targetVisible || !imageEnabled) return;

        activePointers.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY,
          type: event.pointerType
        });

        if (activePointers.size >= 2 && pinchStartDistance > 0) {
          const scale = pinchStartScale * getPointerDistance() / pinchStartDistance;
          const clampedScale = Math.max(0.55, Math.min(1.6, scale));
          rotatableImage.object3D.scale.setScalar(clampedScale);
        } else if (event.pointerId === activePointer) {
          const deltaX = event.clientX - previousPointerX;
          const deltaY = event.clientY - previousPointerY;
          if (poseMode !== 'free') setPoseMode('free', { animate: false, showHint: false });
          rotatableImage.object3D.rotation.y += deltaX * 0.01;
          rotatableImage.object3D.rotation.x += deltaY * 0.01;
          if (parallaxEnabled) {
            const bounds = canvas.getBoundingClientRect();
            setParallaxOffset(
              ((event.clientX - bounds.left) / bounds.width - 0.5) * 2,
              ((event.clientY - bounds.top) / bounds.height - 0.5) * 2
            );
          }
          previousPointerX = event.clientX;
          previousPointerY = event.clientY;
        }
        event.preventDefault();
      });

      canvas.addEventListener('pointermove', event => {
        if (!parallaxEnabled || event.pointerType !== 'mouse' || !targetVisible) return;
        const bounds = canvas.getBoundingClientRect();
        const horizontal = ((event.clientX - bounds.left) / bounds.width - 0.5) * 2;
        const vertical = ((event.clientY - bounds.top) / bounds.height - 0.5) * 2;
        setParallaxOffset(horizontal, vertical);
      });

      const stopGesture = event => {
        activePointers.delete(event.pointerId);
        if (event.pointerId === activePointer) activePointer = null;
        if (activePointers.size < 2) {
          pinchStartDistance = 0;
          const remaining = activePointers.entries().next();
          if (!remaining.done) {
            activePointer = remaining.value[0];
            previousPointerX = remaining.value[1].x;
            previousPointerY = remaining.value[1].y;
          }
        }
      };
      document.addEventListener('pointerup', stopGesture);
      document.addEventListener('pointercancel', stopGesture);
    }

    scene.addEventListener("loaded", setupRotationControls, { once: true });
    if (scene.hasLoaded) setupRotationControls();

    scene.addEventListener("arReady", () => {
      console.log("Scene AR siap!");
      resetScanGuide();
      setCameraStatus('Kamera aktif. Arahkan ke marker.', 'ready');
      setScanGuidance(
        requestedTargetName ? `Pindai: ${requestedTargetName}` : 'Arahkan kamera ke marker',
        requestedTargetName
          ? 'Arahkan kamera ke gambar marker yang dipilih, tampilkan seluruh gambar, dan tahan HP stabil.'
          : 'Tampilkan seluruh gambar, penuhi sebagian besar layar, tahan HP stabil, dan hindari pantulan cahaya.'
      );
      startAdaptiveScanGuidance();
      retryCameraButton.classList.remove('visible');
      retryCameraButton.textContent = 'Mulai pemindaian';
    });
    scene.addEventListener("arError", event => {
      stopAdaptiveScanGuidance();
      const message = getCameraErrorMessage(event);
      setCameraStatus(message.status, 'error');
      setScanGuidance(message.title, message.description, true);
      retryCameraButton.textContent = 'Coba kamera lagi';
      setTargetIndicator('none');
      console.error('MindAR startup error:', event.detail || event);
    });

    window.addEventListener('resize', () => {
      targetIndicator.setAttribute('viewBox', `0 0 ${window.innerWidth} ${window.innerHeight}`);
      if (!targetVisible) resetScanGuide();
    });

    galleryButton.addEventListener('click', () => {
      galleryDialog.showModal();
      gallerySearch.focus();
    });
    document.getElementById('gallery-dock-handle').addEventListener('click', () => {
      galleryDialog.showModal();
      gallerySearch.focus();
    });
    document.getElementById('gallery-close').addEventListener('click', () => galleryDialog.close());
    galleryDialog.addEventListener('click', event => {
      if (event.target === galleryDialog) galleryDialog.close();
    });
    galleryList.addEventListener('click', event => {
      const button = event.target instanceof Element
        ? event.target.closest('button[data-target-index]')
        : null;
      if (!button) return;
      setSelectedGalleryTarget(button.dataset.targetIndex);
    });
    galleryConfirm.addEventListener('click', () => {
      if (selectedTargetIndex !== null) chooseGalleryTarget(selectedTargetIndex);
    });
    gallerySearch.addEventListener('input', filterGallery);
    galleryFilters.addEventListener('click', event => {
      const button = event.target instanceof Element
        ? event.target.closest('button[data-range]')
        : null;
      if (!button) return;
      galleryFilters.querySelectorAll('.gallery-filter').forEach(filter => {
        filter.setAttribute('aria-pressed', String(filter === button));
      });
      filterGallery();
    });
    galleryThumbnails.addEventListener('click', event => {
      const button = event.target instanceof Element
        ? event.target.closest('button[data-target-index]')
        : null;
      if (button) chooseGalleryTarget(button.dataset.targetIndex);
    });
    document.getElementById('gallery-dock-previous').addEventListener('click', () => {
      galleryThumbnails.scrollBy({ left: -150, behavior: 'smooth' });
    });
    document.getElementById('gallery-dock-next').addEventListener('click', () => {
      galleryThumbnails.scrollBy({ left: 150, behavior: 'smooth' });
    });

    drawerButton.addEventListener('click', () => {
      const isOpen = controllerDrawer.hidden;
      controllerDrawer.hidden = !isOpen;
      drawerButton.setAttribute('aria-expanded', String(isOpen));
      if (!isOpen) {
        document.getElementById('social-links').hidden = true;
        linksButton.setAttribute('aria-expanded', 'false');
      } else {
        rotationDrawer.hidden = true;
        rotationDrawerButton.setAttribute('aria-expanded', 'false');
      }
    });

    rotationDrawerButton.addEventListener('click', () => {
      const isOpen = rotationDrawer.hidden;
      rotationDrawer.hidden = !isOpen;
      rotationDrawerButton.setAttribute('aria-expanded', String(isOpen));
      if (isOpen) {
        controllerDrawer.hidden = true;
        drawerButton.setAttribute('aria-expanded', 'false');
        document.getElementById('social-links').hidden = true;
        linksButton.setAttribute('aria-expanded', 'false');
      }
    });

    resetButton.addEventListener('click', () => {
      rotatableImage.object3D.scale.setScalar(1);
      setPoseMode(poseMode, { showHint: false });
      closeDrawer();
      showGestureHint('Sudut dan ukuran karya dikembalikan ke preset mode.');
    });

    poseModeButtons.addEventListener('click', event => {
      const button = event.target instanceof Element
        ? event.target.closest('button[data-pose-mode]')
        : null;
      if (!button || !targetVisible || !imageEnabled) return;
      setPoseMode(button.dataset.poseMode);
    });

    rotationController.addEventListener('click', event => {
      const button = event.target instanceof Element
        ? event.target.closest('button[data-axis][data-step]')
        : null;
      if (!button) return;
      if (!rotatableImage || !targetVisible || !imageEnabled) return;
      const axis = button.dataset.axis;
      if (axis !== 'x' && axis !== 'y') return;
      const step = Number(button.dataset.step);
      if (!Number.isFinite(step)) return;
      if (poseMode !== 'free') setPoseMode('free', { animate: false, showHint: false });
      rotatableImage.object3D.rotation[axis] += step * Math.PI / 180;
    });
    parallaxToggle.addEventListener('click', toggleParallax);

    toggleButton.addEventListener('click', () => {
      imageEnabled = !imageEnabled;
      if (animationFrame !== null) {
        window.cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }
      updateImageVisibility();
      closeDrawer();
      if (imageEnabled) showGestureHint('Gambar ditampilkan kembali.');
      else gestureHint.classList.remove('visible');
    });

    linksButton.addEventListener('click', () => {
      const socialLinks = document.getElementById('social-links');
      const isOpen = socialLinks.hidden;
      socialLinks.hidden = !isOpen;
      linksButton.setAttribute('aria-expanded', String(isOpen));
      showGestureHint(isOpen ? 'Pilih Website atau Instagram untuk membuka tautan.' : 'Panel tautan ditutup.');
    });

    targets = Array.from(document.querySelectorAll('[mindar-image-target]'));
    targets.forEach(target => {
      const content = target.querySelector('.rotatable-image');
      if (!content) {
        console.error(`Konten AR untuk target "${target.id}" tidak ditemukan.`);
        return;
      }
      content.querySelectorAll('a-plane').forEach(plane => plane.classList.add('ar-content-plane'));

      target.addEventListener("targetFound", () => {
        console.log(`Target gambar ${target.id} ditemukan!`);
        stopAdaptiveScanGuidance();
        activeTarget = target;
        activeTargetImage = document.getElementById(target.dataset.imageId);
        rotatableImage = content;
        const configuredZ = rotatableImage.dataset.baseZ;
        configuredPoseZ = configuredZ !== undefined
          ? Number(configuredZ)
          : rotatableImage.object3D.position.z;
        if (!Number.isFinite(configuredPoseZ)) configuredPoseZ = 0.65;
        activeParallaxPlanes = Array.from(content.querySelectorAll('.ar-content-plane')).map(plane => ({
          object: plane.object3D,
          basePosition: plane.object3D.position.clone(),
          baseRotation: plane.object3D.rotation.clone()
        }));
        activeParallaxProfile = {
          shiftX: Number(target.dataset.parallaxX),
          shiftY: Number(target.dataset.parallaxY),
          tilt: Number(target.dataset.parallaxTilt)
        };
        if (Object.values(activeParallaxProfile).some(value => !Number.isFinite(value))) {
          console.error(`Profil parallax untuk target "${target.id}" tidak valid.`);
          activeParallaxProfile = { shiftX: 0.025, shiftY: 0.025, tilt: 0.03 };
        }
        if (!rotatableImage) {
          console.error(`Konten AR untuk target "${target.id}" tidak ditemukan.`);
          setCameraStatus('Konten karya AR gagal dimuat.', 'error');
          return;
        }
        const overlay = document.querySelector('#scanning-overlay');
        if (overlay) overlay.style.display = 'none';
        const video = target.querySelector('video');
        if (video) video.play().catch(error => console.warn('Autoplay video AR diblokir:', error));
        targetVisible = true;
        setSelectedGalleryTarget(target.id.replace('image-target-', ''));
        setPoseMode('attached', { animate: false, showHint: false });
        updateImageVisibility();
        if (imageEnabled) animateImageIn();
        closeDrawer();
        const targetName = target.dataset.targetName || target.id;
        setCameraStatus(`Terdeteksi: ${targetName}`, 'ready');
        setScanGuidance('Marker terdeteksi', `Karya "${targetName}" ditemukan. Pertahankan gambar di dalam pandangan kamera.`);
        showGestureHint('Pilih Tempel, 45°, atau Bebas. Mode Bebas mendukung drag 360°; cubit untuk zoom.');
        animateScanGuideToTarget();
      });

      target.addEventListener("targetLost", () => {
        if (activeTarget !== target) return;
        console.log(`Target gambar ${target.id} hilang.`);
        const overlay = document.querySelector('#scanning-overlay');
        if (overlay) overlay.style.display = 'flex';
        const video = target.querySelector('video');
        if (video) video.pause();
        targetVisible = false;
        if (parallaxEnabled) {
          window.removeEventListener('deviceorientation', handleDeviceOrientation);
          parallaxEnabled = false;
          parallaxToggle.setAttribute('aria-pressed', 'false');
          parallaxToggle.textContent = 'Visual: Normal';
        }
        if (parallaxAnimationFrame !== null) {
          window.cancelAnimationFrame(parallaxAnimationFrame);
          parallaxAnimationFrame = null;
        }
        parallaxInputX = 0;
        parallaxInputY = 0;
        resetParallaxPlanes();
        activeParallaxPlanes = [];
        activeParallaxProfile = null;
        activePointer = null;
        activePointers.clear();
        window.clearTimeout(gestureHintTimeout);
        gestureHint.classList.remove('visible');
        if (animationFrame !== null) {
          window.cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }
        if (poseTransitionFrame !== null) {
          window.cancelAnimationFrame(poseTransitionFrame);
          poseTransitionFrame = null;
        }
        closeDrawer();
        updateImageVisibility();
        setCameraStatus('Marker hilang. Arahkan kamera ke marker lagi.', 'ready');
        setScanGuidance('Cari marker', 'Geser kamera perlahan dan jaga marker tetap terang serta terlihat utuh.');
        startAdaptiveScanGuidance();
        activeTarget = null;
        activeTargetImage = null;
        rotatableImage = null;
        resetScanGuide();
      });
    });

    if (targets.length) {
      setSelectedGalleryTarget(targets[0].id.replace('image-target-', ''));
    }
    resetScanGuide();
    retryCameraButton.addEventListener('click', startAR);

    async function startAR(targetName = '') {
      if (!checkCameraSupport()) return;
      requestedTargetName = targetName || requestedTargetName;
      retryCameraButton.disabled = true;
      retryCameraButton.textContent = 'Menyalakan kamera...';
      setCameraStatus('Meminta akses kamera dan memulai AR...', 'loading');
      setScanGuidance('Menyiapkan kamera', `Jika diminta, izinkan akses kamera untuk mencari ${requestedTargetName ? `marker "${requestedTargetName}"` : 'marker'}.`, true);
      scannerStarting = true;
      try {
        await scene.systems['mindar-image-system'].start();
        scannerStarted = true;
      } catch (error) {
        const message = getCameraErrorMessage(error);
        setCameraStatus(message.status, 'error');
        setScanGuidance(message.title, message.description, true);
        retryCameraButton.textContent = 'Coba kamera lagi';
        setTargetIndicator('none');
        console.error('MindAR failed to start:', error);
      } finally {
        scannerStarting = false;
        retryCameraButton.disabled = false;
        if (retryCameraButton.classList.contains('visible')) {
          retryCameraButton.textContent = 'Coba kamera lagi';
        }
      }
    }

    if (!checkCameraSupport()) {
      setTargetIndicator('none');
      return;
    }
    setCameraStatus('Kamera siap. Tekan tombol untuk memulai pemindaian.');
    setScanGuidance('Siap memindai?', 'Tekan tombol untuk mengaktifkan kamera dan mulai mencari marker.', true);
    }
  </script>
  <script type="module">
    import { AR_TARGETS } from './ar-targets.js';
    import { isSupabaseConfigured } from './supabase-client.js';
    import { getMindFile, getTargets } from './studio-storage.js';

    const scene = document.querySelector('a-scene');
    const syncStatus = document.getElementById('studio-sync-status');
    const galleryList = document.getElementById('gallery-list');
    const galleryEmpty = document.getElementById('gallery-empty');
    const galleryDescription = document.getElementById('gallery-description');
    const galleryThumbnails = document.getElementById('gallery-thumbnails');

    function renderGallery(items) {
      galleryList.querySelectorAll('.gallery-card').forEach(card => card.remove());
      galleryThumbnails.replaceChildren();
      items.forEach(item => {
        const card = document.createElement('article');
        card.className = 'gallery-card';
        card.dataset.searchText = item.name.toLocaleLowerCase('id');
        card.dataset.targetIndex = String(item.targetIndex);
        const image = document.createElement('img');
        image.src = item.markerUrl;
        image.alt = `Marker untuk dipindai: ${item.name}`;
        const title = document.createElement('h3');
        title.textContent = item.name;
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.targetIndex = String(item.targetIndex);
        button.textContent = '＋';
        button.setAttribute('aria-label', `Pilih ${item.name}`);
        button.setAttribute('aria-pressed', 'false');
        card.append(image, title, button);
        galleryList.append(card);

        const thumbnail = document.createElement('button');
        thumbnail.className = 'gallery-thumbnail';
        thumbnail.type = 'button';
        thumbnail.dataset.targetIndex = String(item.targetIndex);
        thumbnail.setAttribute('aria-label', `Pindai ${item.name}`);
        thumbnail.setAttribute('aria-current', 'false');
        const thumbnailImage = document.createElement('img');
        thumbnailImage.src = item.markerUrl;
        thumbnailImage.alt = '';
        thumbnail.append(thumbnailImage);
        galleryThumbnails.append(thumbnail);
      });
      galleryEmpty.hidden = items.length > 0;
      galleryEmpty.textContent = items.length
        ? ''
        : 'Belum ada marker aktif di katalog ini.';
      galleryDescription.textContent = `${items.length} marker siap dipindai. Pilih marker, lalu arahkan kamera ke gambar yang sama.`;
      document.getElementById('gallery-total').textContent = `${items.length} gambar`;
      document.getElementById('gallery-confirm').disabled = items.length === 0;
    }

    function setParallaxProfile(target, values) {
      target.dataset.parallaxX = String(values[0]);
      target.dataset.parallaxY = String(values[1]);
      target.dataset.parallaxTilt = String(values[2]);
    }

    async function waitForImage(image, source) {
      if (!image.complete) {
        await new Promise((resolve, reject) => {
          image.addEventListener('load', resolve, { once: true });
          image.addEventListener('error', () => reject(new Error(`Gambar gagal dimuat: ${source}`)), { once: true });
        });
      }
      if (!image.naturalWidth || !image.naturalHeight) {
        throw new Error(`Gambar tidak valid: ${source}`);
      }
    }

    async function addBuiltInTargets() {
      const assets = scene.querySelector('a-assets');
      for (const [targetIndex, artwork] of AR_TARGETS.entries()) {
        const markerId = `target-image-${targetIndex}`;
        const marker = document.createElement('img');
        marker.id = markerId;
        marker.src = artwork.file;
        assets.append(marker);
        const artworkId = `ar-content-${targetIndex}`;
        const displayImage = document.createElement('img');
        displayImage.id = artworkId;
        displayImage.src = artwork.artworkFile;
        assets.append(displayImage);
        await Promise.all([waitForImage(marker, artwork.file), waitForImage(displayImage, artwork.artworkFile)]);

        const height = displayImage.naturalHeight / displayImage.naturalWidth;
        const target = document.createElement('a-entity');
        target.id = `image-target-${targetIndex}`;
        target.setAttribute('mindar-image-target', `targetIndex: ${targetIndex}`);
        target.dataset.imageId = markerId;
        target.dataset.targetName = artwork.name;
        setParallaxProfile(target, artwork.parallax);

        const wrapper = document.createElement('a-entity');
        wrapper.classList.add('rotatable-image');
        wrapper.dataset.baseZ = '0.7';
        wrapper.setAttribute('position', '0 0.08 0.7');
        const plane = document.createElement('a-plane');
        plane.setAttribute('src', `#${artworkId}`);
        plane.setAttribute('width', '1');
        plane.setAttribute('height', String(height));
        plane.setAttribute('material', 'shader: flat; side: double; transparent: true');
        wrapper.append(plane);
        target.append(wrapper);
        scene.append(target);
      }
      renderGallery(AR_TARGETS.map((artwork, targetIndex) => ({
        targetIndex,
        name: artwork.name,
        markerUrl: artwork.file
      })));
    }

    function addTarget(record, markerUrl, contentUrl) {
      const assets = scene.querySelector('a-assets');
      const markerId = `target-image-${record.target_index}`;
      const contentId = `ar-content-${record.target_index}`;
      const marker = document.createElement('img');
      marker.id = markerId;
      marker.src = markerUrl;
      assets.append(marker);

      const content = document.createElement(record.content_type === 'video' ? 'video' : 'img');
      content.id = contentId;
      content.src = contentUrl;
      if (record.content_type === 'video') {
        content.loop = true;
        content.muted = true;
        content.playsInline = true;
      }
      assets.append(content);

      const target = document.createElement('a-entity');
