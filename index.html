<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Visual Feeder AR Business Card</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #111;
      color: white;
      overflow: hidden;
    }

    #camera-status {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1200;
      max-width: 90%;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.6);
      font-size: 14px;
      text-align: center;
      line-height: 1.4;
      backdrop-filter: blur(4px);
    }

    #camera-status.error {
      background: rgba(160, 25, 25, 0.8);
    }

    #camera-status.ready {
      background: rgba(20, 110, 65, 0.82);
    }

    #target-indicator {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1100;
      pointer-events: none;
      display: none;
    }

    #target-indicator polygon {
      fill: rgba(255, 215, 65, 0.06);
      stroke: rgba(255, 215, 65, 0.95);
      stroke-width: 5;
      vector-effect: non-scaling-stroke;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 7px rgba(255, 215, 65, 0.75));
    }

    #target-indicator.active {
      display: block;
    }

    #target-indicator.active polygon {
      fill: rgba(76, 255, 133, 0.08);
      stroke: rgba(76, 255, 133, 0.98);
      filter: drop-shadow(0 0 9px rgba(76, 255, 133, 0.8));
    }

    #target-indicator.inactive {
      display: block;
      animation: guide-pulse 1.6s ease-in-out infinite alternate;
    }

    #game-drawer {
      position: fixed;
      top: 50%;
      left: -150px;
      width: 300px;
      height: 300px;
      z-index: 1300;
      border: 1px solid rgba(91, 203, 255, 0.75);
      border-left: 0;
      border-radius: 0 150px 150px 0;
      background: radial-gradient(ellipse at right, rgba(0, 117, 255, 0.28), rgba(0, 13, 40, 0.9) 72%);
      box-shadow: 0 0 20px rgba(0, 153, 255, 0.52), inset -8px 0 24px rgba(0, 153, 255, 0.2);
      backdrop-filter: blur(12px);
      transform: translate(-90px, -50%);
      transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: none;
    }

    #game-drawer.visible {
      display: block;
    }

    #game-drawer.open {
      transform: translate(0, -50%);
    }

    #game-drawer.open #drawer-wheel {
      pointer-events: auto;
    }

    #game-drawer button {
      border: 1px solid rgba(91, 203, 255, 0.8);
      background: rgba(0, 117, 255, 0.34);
      color: white;
      box-shadow: 0 0 12px rgba(0, 153, 255, 0.62), inset 0 0 12px rgba(0, 153, 255, 0.2);
      backdrop-filter: blur(10px);
      text-shadow: 0 0 8px rgba(110, 220, 255, 0.9);
      cursor: pointer;
    }

    #game-drawer button:active,
    #game-drawer button:focus-visible,
    #social-links a:focus-visible {
      outline: 2px solid rgba(177, 238, 255, 0.95);
      outline-offset: 2px;
      background: rgba(0, 145, 255, 0.6);
      box-shadow: 0 0 20px rgba(0, 174, 255, 1), inset 0 0 14px rgba(0, 153, 255, 0.3);
    }

    #toggle-drawer {
      position: absolute;
      top: 8px;
      right: 0;
      width: 60px;
      min-height: 54px;
      border-radius: 18px 0 0 18px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
    }

    #toggle-drawer::before {
      content: "›";
      display: block;
      font-size: 24px;
      line-height: 20px;
    }

    #game-drawer.open #toggle-drawer::before {
      content: "‹";
    }

    #drawer-wheel {
      position: absolute;
      inset: 0;
      pointer-events: none;
      touch-action: none;
      cursor: grab;
    }

    #drawer-wheel:active {
      cursor: grabbing;
    }

    #drawer-wheel::before {
      content: "";
      position: absolute;
      left: 178px;
      top: 103px;
      width: 94px;
      height: 94px;
      border: 1px dashed rgba(128, 223, 255, 0.45);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(0, 153, 255, 0.22);
      pointer-events: none;
    }

    #drawer-wheel::after {
      content: "↻";
      position: absolute;
      left: 207px;
      top: 131px;
      color: rgba(177, 238, 255, 0.88);
      font-size: 28px;
      line-height: 36px;
      text-shadow: 0 0 12px rgba(0, 174, 255, 0.95);
      pointer-events: none;
    }

    .drawer-action {
      position: absolute;
      left: 0;
      top: 0;
      width: 70px;
      min-height: 48px;
      padding: 6px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) rotate(var(--counter-rotation, 0deg));
      transition: opacity 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    #game-drawer.open .drawer-action {
      opacity: 1;
      pointer-events: auto;
    }

    #social-links {
      position: absolute;
      top: 50%;
      left: calc(100% + 6px);
      display: none;
      flex-direction: column;
      gap: 10px;
      width: min(144px, calc(100vw - 166px));
      transform: translateY(-50%);
    }

    #game-drawer.links-open #social-links {
      display: flex;
    }

    #social-links a {
      display: block;
      padding: 13px 12px;
      border: 1px solid rgba(91, 203, 255, 0.85);
      border-radius: 14px;
      background: rgba(0, 30, 74, 0.9);
      color: white;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 0 12px rgba(0, 153, 255, 0.58), inset 0 0 12px rgba(0, 153, 255, 0.18);
      backdrop-filter: blur(10px);
      text-shadow: 0 0 8px rgba(110, 220, 255, 0.9);
    }

    #gesture-hint {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 1250;
      width: max-content;
      max-width: 88vw;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.78);
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      pointer-events: none;
    }

    #gesture-hint.visible {
      opacity: 1;
      visibility: visible;
    }

    @keyframes guide-pulse {
      from { opacity: 0.48; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="camera-status">Memeriksa kamera...</div>
  <svg id="target-indicator" class="inactive" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">
    <polygon id="target-indicator-shape" points="0,0 0,0 0,0 0,0"></polygon>
  </svg>
  <div id="gesture-hint" role="status" aria-live="polite"></div>
  <div id="game-drawer" aria-label="Menu AR">
    <button id="toggle-drawer" type="button" aria-expanded="false" aria-controls="drawer-reset drawer-toggle-image drawer-toggle-links">MENU</button>
    <div id="drawer-wheel">
      <button id="drawer-reset" class="drawer-action" type="button">Atur ulang</button>
      <button id="drawer-toggle-image" class="drawer-action" type="button">Sembunyikan gambar</button>
      <button id="drawer-toggle-links" class="drawer-action" type="button" aria-expanded="false" aria-controls="social-links">Tautan</button>
    </div>
    <nav id="social-links" aria-label="Tautan sekolah">
      <a href="https://smkbinamandirimultimedia.sch.id/" target="_blank" rel="noopener noreferrer">Website</a>
      <a href="https://www.instagram.com/smkbm_3/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </nav>
  </div>
  <!-- Ganti imageTargetSrc dengan file .mind Anda -->
  <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiScanning: #scanning-overlay;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <img id="target-image" src="Karya/Artboard 1@300x-100.jpg">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity id="rotatable-image" position="0 0 0.65">
        <a-plane
          src="#target-image"
          width="1"
          height="1.78"
          material="shader: flat"
        ></a-plane>
        <a-plane
          src="#target-image"
          rotation="0 180 0"
          position="0 0 -0.002"
          width="1"
          height="1.78"
          material="shader: flat"
        ></a-plane>
      </a-entity>
    </a-entity>
  </a-scene>

  <div id="scanning-overlay" style="display: flex; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: white; z-index: 999; font-family: sans-serif; font-size: 20px;">
    Arahkan kamera ke kartu nama...
  </div>

  <script>
    const scene = document.querySelector('a-scene');
    const cameraStatus = document.getElementById('camera-status');
    const targetIndicator = document.getElementById('target-indicator');
    const targetIndicatorShape = document.getElementById('target-indicator-shape');
    const gestureHint = document.getElementById('gesture-hint');
    const gameDrawer = document.getElementById('game-drawer');
    const drawerWheel = document.getElementById('drawer-wheel');
    const drawerButton = document.getElementById('toggle-drawer');
    const resetButton = document.getElementById('drawer-reset');
    const toggleButton = document.getElementById('drawer-toggle-image');
    const linksButton = document.getElementById('drawer-toggle-links');
    const target = document.querySelector('[mindar-image-target]');
    const rotatableImage = document.getElementById('rotatable-image');
    let targetVisible = false;
    let imageEnabled = true;
    let activePointer = null;
    let previousPointerX = 0;
    let gestureHintTimeout = null;
    let animationFrame = null;
    let guideAnimationFrame = null;
    let guideHideTimeout = null;
    let drawerPointerId = null;
    let lastDrawerPointerAngle = 0;
    let drawerRotation = 0;
    const activePointers = new Map();
    let pinchStartDistance = 0;
    let pinchStartScale = 1;

    function setCameraStatus(message, type = '') {
      cameraStatus.textContent = message;
      cameraStatus.classList.remove('error', 'ready');
      if (type) cameraStatus.classList.add(type);
    }

    function setTargetIndicator(state) {
      targetIndicator.classList.remove('active', 'inactive');
      if (state === 'active') {
        targetIndicator.classList.add('active');
      } else if (state === 'inactive') {
        targetIndicator.classList.add('inactive');
        targetIndicator.style.display = 'block';
      } else {
        targetIndicator.style.display = 'none';
      }
    }

    function setGuidePoints(points) {
      targetIndicatorShape.setAttribute(
        'points',
        points.map(point => `${point.x},${point.y}`).join(' ')
      );
    }

    function getSmallGuidePoints() {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const size = Math.min(44, window.innerWidth * 0.14, window.innerHeight * 0.08);
      const half = size / 2;
      return [
        { x: centerX - half, y: centerY - half },
        { x: centerX + half, y: centerY - half },
        { x: centerX + half, y: centerY + half },
        { x: centerX - half, y: centerY + half }
      ];
    }

    function getTargetScreenPoints() {
      if (!scene.camera || !target.object3D) return null;
      scene.object3D.updateMatrixWorld(true);
      scene.camera.updateMatrixWorld(true);
      const corners = [
        [-0.5, -0.89, 0],
        [0.5, -0.89, 0],
        [0.5, 0.89, 0],
        [-0.5, 0.89, 0]
      ];
      const points = corners.map(([x, y, z]) => {
        const point = target.object3D.localToWorld(new THREE.Vector3(x, y, z));
        point.project(scene.camera);
        return {
          x: (point.x + 1) * 0.5 * window.innerWidth,
          y: (1 - point.y) * 0.5 * window.innerHeight
        };
      });
      return points.every(point => Number.isFinite(point.x) && Number.isFinite(point.y))
        ? points
        : null;
    }

    function resetScanGuide() {
      window.clearTimeout(guideHideTimeout);
      if (guideAnimationFrame !== null) {
        window.cancelAnimationFrame(guideAnimationFrame);
        guideAnimationFrame = null;
      }
      targetIndicator.setAttribute('viewBox', `0 0 ${window.innerWidth} ${window.innerHeight}`);
      setGuidePoints(getSmallGuidePoints());
      setTargetIndicator('inactive');
    }

    function animateScanGuideToTarget() {
      window.clearTimeout(guideHideTimeout);
      const endPoints = getTargetScreenPoints();
      if (!endPoints) {
        setTargetIndicator('none');
        return;
      }

      if (guideAnimationFrame !== null) window.cancelAnimationFrame(guideAnimationFrame);
      const startPoints = getSmallGuidePoints();
      const startTime = performance.now();
      const duration = 420;

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const currentTargetPoints = getTargetScreenPoints() || endPoints;
        setGuidePoints(startPoints.map((point, index) => ({
          x: point.x + (currentTargetPoints[index].x - point.x) * eased,
          y: point.y + (currentTargetPoints[index].y - point.y) * eased
        })));

        if (elapsed < 950 && targetVisible) {
          guideAnimationFrame = window.requestAnimationFrame(animate);
        } else {
          guideAnimationFrame = null;
        }
      }

      setTargetIndicator('active');
      targetIndicator.setAttribute('viewBox', `0 0 ${window.innerWidth} ${window.innerHeight}`);
      guideAnimationFrame = window.requestAnimationFrame(animate);
      guideHideTimeout = window.setTimeout(() => {
        if (targetVisible) setTargetIndicator('none');
      }, 950);
    }

    function updateDrawerWheel() {
      const actions = [resetButton, toggleButton, linksButton];
      const baseAngles = [-90, 30, 150];
      const pivotX = 225;
      const pivotY = 150;
      const radius = 40;
      actions.forEach((button, index) => {
        const angle = (baseAngles[index] + drawerRotation) * Math.PI / 180;
        const centerX = pivotX + Math.cos(angle) * radius;
        const centerY = pivotY + Math.sin(angle) * radius;
        button.style.left = `${centerX}px`;
        button.style.top = `${centerY}px`;
        button.style.setProperty('--counter-rotation', `${-drawerRotation}deg`);
      });
    }

    function getDrawerPointerAngle(event) {
      const bounds = gameDrawer.getBoundingClientRect();
      const pivotX = bounds.left + 225;
      const pivotY = bounds.top + 150;
      return Math.atan2(event.clientY - pivotY, event.clientX - pivotX) * 180 / Math.PI;
    }

    function updateImageVisibility() {
      rotatableImage.object3D.visible = targetVisible && imageEnabled;
      gameDrawer.classList.toggle('visible', targetVisible);
      toggleButton.textContent = imageEnabled ? 'Sembunyikan gambar' : 'Tampilkan gambar';
    }

    function closeDrawer() {
      gameDrawer.classList.remove('open', 'links-open');
      drawerButton.setAttribute('aria-expanded', 'false');
      linksButton.setAttribute('aria-expanded', 'false');
    }

    function showGestureHint(message, fadeDelay = 5000) {
      window.clearTimeout(gestureHintTimeout);
      gestureHint.textContent = message;
      gestureHint.classList.add('visible');
      gestureHintTimeout = window.setTimeout(() => {
        gestureHint.classList.remove('visible');
      }, fadeDelay);
    }

    function animateImageIn() {
      if (animationFrame !== null) window.cancelAnimationFrame(animationFrame);

      const duration = 450;
      const startTime = performance.now();
      const startZ = 0.4;
      const endZ = 0.65;
      rotatableImage.object3D.position.z = startZ;
      rotatableImage.object3D.scale.setScalar(0.82);

      function animate(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        rotatableImage.object3D.position.z = startZ + (endZ - startZ) * eased;
        rotatableImage.object3D.scale.setScalar(0.82 + 0.18 * eased);
        if (progress < 1 && targetVisible && imageEnabled) {
          animationFrame = window.requestAnimationFrame(animate);
        } else {
          animationFrame = null;
        }
      }

      animationFrame = window.requestAnimationFrame(animate);
    }

    function getPointerDistance() {
      const points = Array.from(activePointers.values());
      if (points.length < 2) return 0;
      return Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
    }

    async function detectCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setCameraStatus('Browser Anda tidak mendukung kamera.', 'error');
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });

        setCameraStatus('Kamera aktif. Arahkan ke target AR.', 'ready');
        setTargetIndicator('inactive');
        stream.getTracks().forEach(track => track.stop());
      } catch (error) {
        setCameraStatus('Kamera tidak bisa diakses. Izinkan akses kamera di browser.', 'error');
        setTargetIndicator('none');
        console.error('Camera permission failed:', error);
      }
    }

    function setupRotationControls() {
      if (setupRotationControls.initialized) return;
      setupRotationControls.initialized = true;
      const canvas = scene.canvas;
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();

      canvas.style.touchAction = 'none';
      if (canvas.parentElement) canvas.parentElement.style.touchAction = 'none';

      document.addEventListener('pointerdown', event => {
        if (!targetVisible || !imageEnabled ||
            (event.target instanceof Element && event.target.closest('#game-drawer'))) return;

        const bounds = canvas.getBoundingClientRect();
        pointer.x = ((event.clientX - bounds.left) / bounds.width) * 2 - 1;
        pointer.y = -((event.clientY - bounds.top) / bounds.height) * 2 + 1;
        scene.object3D.updateMatrixWorld(true);
        raycaster.setFromCamera(pointer, scene.camera);

        if (raycaster.intersectObject(rotatableImage.object3D, true).length === 0) return;

        activePointers.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY,
          type: event.pointerType
        });

        if (activePointers.size === 1) {
          activePointer = event.pointerId;
          previousPointerX = event.clientX;
        } else if (activePointers.size === 2 && event.pointerType === 'touch') {
          activePointer = null;
          pinchStartDistance = getPointerDistance();
          pinchStartScale = rotatableImage.object3D.scale.x;
        }
      });

      document.addEventListener('pointermove', event => {
        if (!activePointers.has(event.pointerId) || !targetVisible || !imageEnabled) return;

        activePointers.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY,
          type: event.pointerType
        });

        if (activePointers.size >= 2 && pinchStartDistance > 0) {
          const scale = pinchStartScale * getPointerDistance() / pinchStartDistance;
          const clampedScale = Math.max(0.55, Math.min(1.6, scale));
          rotatableImage.object3D.scale.setScalar(clampedScale);
        } else if (event.pointerId === activePointer) {
          const deltaX = event.clientX - previousPointerX;
          rotatableImage.object3D.rotation.y += deltaX * 0.01;
          previousPointerX = event.clientX;
        }
        event.preventDefault();
      });

      const stopGesture = event => {
        activePointers.delete(event.pointerId);
        if (event.pointerId === activePointer) activePointer = null;
        if (activePointers.size < 2) {
          pinchStartDistance = 0;
          const remaining = activePointers.entries().next();
          if (!remaining.done) {
            activePointer = remaining.value[0];
            previousPointerX = remaining.value[1].x;
          }
        }
      };
      document.addEventListener('pointerup', stopGesture);
      document.addEventListener('pointercancel', stopGesture);
    }

    scene.addEventListener("loaded", setupRotationControls, { once: true });
    if (scene.hasLoaded) setupRotationControls();

    scene.addEventListener("ready", (event) => {
      console.log("Scene AR siap!");
      resetScanGuide();
      detectCamera();
    });

    window.addEventListener('resize', () => {
      if (!targetVisible) resetScanGuide();
    });

    drawerButton.addEventListener('click', () => {
      const isOpen = gameDrawer.classList.toggle('open');
      drawerButton.setAttribute('aria-expanded', String(isOpen));
      if (!isOpen) {
        gameDrawer.classList.remove('links-open');
        linksButton.setAttribute('aria-expanded', 'false');
      }
    });

    resetButton.addEventListener('click', () => {
      rotatableImage.object3D.rotation.set(0, 0, 0);
      rotatableImage.object3D.scale.setScalar(1);
      closeDrawer();
      showGestureHint('Rotasi dan ukuran gambar dikembalikan ke awal.');
    });

    toggleButton.addEventListener('click', () => {
      imageEnabled = !imageEnabled;
      if (animationFrame !== null) {
        window.cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }
      updateImageVisibility();
      closeDrawer();
      if (imageEnabled) showGestureHint('Gambar ditampilkan kembali.');
      else gestureHint.classList.remove('visible');
    });

    linksButton.addEventListener('click', () => {
      const isOpen = gameDrawer.classList.toggle('links-open');
      linksButton.setAttribute('aria-expanded', String(isOpen));
      showGestureHint(isOpen ? 'Pilih Website atau Instagram untuk membuka tautan.' : 'Panel tautan ditutup.');
    });

    drawerWheel.addEventListener('pointerdown', event => {
      if (!gameDrawer.classList.contains('open') ||
          (event.target instanceof Element && event.target.closest('button, a'))) return;
      drawerPointerId = event.pointerId;
      lastDrawerPointerAngle = getDrawerPointerAngle(event);
      drawerWheel.setPointerCapture(event.pointerId);
      event.preventDefault();
    });

    drawerWheel.addEventListener('pointermove', event => {
      if (event.pointerId !== drawerPointerId) return;
      const currentAngle = getDrawerPointerAngle(event);
      let delta = currentAngle - lastDrawerPointerAngle;
      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;
      drawerRotation = (drawerRotation + delta) % 360;
      lastDrawerPointerAngle = currentAngle;
      updateDrawerWheel();
    });

    const stopDrawerRotation = event => {
      if (event.pointerId === drawerPointerId) drawerPointerId = null;
    };
    drawerWheel.addEventListener('pointerup', stopDrawerRotation);
    drawerWheel.addEventListener('pointercancel', stopDrawerRotation);

    target.addEventListener("targetFound", event => {
        console.log("Target kartu nama ditemukan!");
        const overlay = document.querySelector('#scanning-overlay');
        if (overlay) overlay.style.display = 'none';
        targetVisible = true;
        updateImageVisibility();
        if (imageEnabled) animateImageIn();
        closeDrawer();
        setCameraStatus('Target berhasil dipindai.', 'ready');
        showGestureHint('Usap gambar untuk memutar · cubit untuk zoom · buka MENU di kiri dan putar lacinya.');
        animateScanGuideToTarget();
    });

    target.addEventListener("targetLost", event => {
        console.log("Target kartu nama hilang.");
        const overlay = document.querySelector('#scanning-overlay');
        if (overlay) overlay.style.display = 'flex';
        targetVisible = false;
        activePointer = null;
        activePointers.clear();
        drawerPointerId = null;
        window.clearTimeout(gestureHintTimeout);
        gestureHint.classList.remove('visible');
        if (animationFrame !== null) {
          window.cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }
        closeDrawer();
        updateImageVisibility();
        setCameraStatus('Target hilang. Arahkan kamera ke target lagi.', 'ready');
        resetScanGuide();
    });

    updateDrawerWheel();
    resetScanGuide();
  </script>

</body>
