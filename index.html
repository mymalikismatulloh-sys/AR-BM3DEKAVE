<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Visual Feeder AR Business Card</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #111;
      color: white;
      overflow: hidden;
    }

    #camera-status {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1200;
      max-width: 90%;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.6);
      font-size: 14px;
      text-align: center;
      line-height: 1.4;
      backdrop-filter: blur(4px);
    }

    #camera-status.error {
      background: rgba(160, 25, 25, 0.8);
    }

    #camera-status.ready {
      background: rgba(20, 110, 65, 0.82);
    }

    #camera-status.loading::before {
      content: "";
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 9px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: white;
      border-radius: 50%;
      vertical-align: -1px;
      animation: status-spin 0.8s linear infinite;
    }

    #scanning-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.22);
      pointer-events: none;
      font-family: sans-serif;
    }

    #scan-guidance {
      width: min(360px, 88vw);
      padding: 22px 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      background: rgba(7, 15, 25, 0.84);
      box-shadow: 0 14px 48px rgba(0, 0, 0, 0.35);
      text-align: center;
      backdrop-filter: blur(12px);
      pointer-events: auto;
    }

    #scan-guidance h1 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    #scan-guidance p {
      margin: 0;
      color: #c3d1df;
      font-size: 14px;
      line-height: 1.5;
    }

    #retry-camera {
      display: inline-flex;
      margin: 16px auto 0;
      padding: 10px 16px;
      border: 1px solid #57d2d9;
      border-radius: 10px;
      background: #087f91;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    #retry-camera:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #retry-camera:not(.visible) {
      display: none;
    }

    #retry-camera.visible {
      display: inline-flex;
    }

    #studio-sync-status {
      position: fixed;
      top: 62px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1200;
      max-width: 90%;
      padding: 6px 11px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.58);
      color: #d5e5f2;
      font-size: 11px;
      text-align: center;
    }

    #target-indicator {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1100;
      pointer-events: none;
      display: none;
    }

    #target-indicator polygon {
      fill: rgba(255, 215, 65, 0.06);
      stroke: rgba(255, 215, 65, 0.95);
      stroke-width: 5;
      vector-effect: non-scaling-stroke;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 7px rgba(255, 215, 65, 0.75));
    }

    #target-indicator.active {
      display: block;
    }

    #target-indicator.active polygon {
      fill: rgba(76, 255, 133, 0.08);
      stroke: rgba(76, 255, 133, 0.98);
      filter: drop-shadow(0 0 9px rgba(76, 255, 133, 0.8));
    }

    #target-indicator.inactive {
      display: block;
      animation: guide-pulse 1.6s ease-in-out infinite alternate;
    }

    #rotation-controller {
      position: fixed;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(76px, calc(env(safe-area-inset-bottom) + 64px));
      z-index: 1250;
      display: none;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: auto auto repeat(2, 44px) auto;
      align-items: center;
      justify-items: center;
      gap: 6px;
      padding: 10px;
      border: 1px solid rgba(91, 203, 255, 0.65);
      border-radius: 16px;
      background: rgba(0, 13, 40, 0.86);
      box-shadow: 0 0 18px rgba(0, 153, 255, 0.35);
      backdrop-filter: blur(10px);
    }

    #rotation-controller.visible {
      display: grid;
    }

    #rotation-controller h2 {
      grid-column: 1 / -1;
      margin: 0 0 2px;
      color: #d7f4ff;
      font-size: 12px;
      text-align: center;
    }

    #rotation-controller button {
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid rgba(91, 203, 255, 0.75);
      border-radius: 12px;
      background: rgba(0, 117, 255, 0.3);
      color: white;
      font-size: 20px;
      touch-action: manipulation;
    }

    #rotation-controller button:active,
    #rotation-controller button:focus-visible {
      outline: 2px solid rgba(177, 238, 255, 0.95);
      outline-offset: 2px;
      background: rgba(0, 145, 255, 0.65);
    }

    #rotation-controller [data-axis="x"] {
      color: #9fe8ff;
      font-size: 11px;
      font-weight: 700;
    }

    #parallax-toggle {
      grid-column: 1 / -1;
      width: auto !important;
      height: auto !important;
      min-height: 38px;
      padding: 7px 10px !important;
      font-size: 12px !important;
      font-weight: 700;
      white-space: nowrap;
    }

    #pose-mode-controls {
      grid-column: 1 / -1;
      display: grid;
      gap: 5px;
      width: 100%;
    }

    #pose-mode-controls h3 {
      margin: 0;
      color: #d7f4ff;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
    }

    #pose-mode-buttons {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
    }

    #pose-mode-buttons button {
      width: auto;
      height: 34px;
      padding: 0 3px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 700;
    }

    #pose-mode-buttons button[aria-pressed="true"] {
      border-color: #73e6bb;
      background: rgba(0, 145, 105, 0.62);
      box-shadow: 0 0 10px rgba(65, 230, 177, 0.3);
    }

    #parallax-toggle[aria-pressed="true"] {
      border-color: #73e6bb !important;
      background: rgba(0, 145, 105, 0.62) !important;
    }

    #game-drawer {
      position: fixed;
      top: 50%;
      left: -150px;
      width: 300px;
      height: 300px;
      z-index: 1300;
      border: 1px solid rgba(91, 203, 255, 0.75);
      border-left: 0;
      border-radius: 0 150px 150px 0;
      background: radial-gradient(ellipse at right, rgba(0, 117, 255, 0.28), rgba(0, 13, 40, 0.9) 72%);
      box-shadow: 0 0 20px rgba(0, 153, 255, 0.52), inset -8px 0 24px rgba(0, 153, 255, 0.2);
      backdrop-filter: blur(12px);
      transform: translate(-90px, -50%);
      transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: none;
    }

    #game-drawer.visible {
      display: block;
    }

    #game-drawer.open {
      transform: translate(0, -50%);
    }

    #game-drawer.open #drawer-wheel {
      pointer-events: auto;
    }

    #game-drawer button {
      border: 1px solid rgba(91, 203, 255, 0.8);
      background: rgba(0, 117, 255, 0.34);
      color: white;
      box-shadow: 0 0 12px rgba(0, 153, 255, 0.62), inset 0 0 12px rgba(0, 153, 255, 0.2);
      backdrop-filter: blur(10px);
      text-shadow: 0 0 8px rgba(110, 220, 255, 0.9);
      cursor: pointer;
    }

    #game-drawer button:active,
    #game-drawer button:focus-visible,
    #social-links a:focus-visible {
      outline: 2px solid rgba(177, 238, 255, 0.95);
      outline-offset: 2px;
      background: rgba(0, 145, 255, 0.6);
      box-shadow: 0 0 20px rgba(0, 174, 255, 1), inset 0 0 14px rgba(0, 153, 255, 0.3);
    }

    #toggle-drawer {
      position: absolute;
      top: 8px;
      right: 0;
      width: 60px;
      min-height: 54px;
      border-radius: 18px 0 0 18px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
    }

    #toggle-drawer::before {
      content: "›";
      display: block;
      font-size: 24px;
      line-height: 20px;
    }

    #game-drawer.open #toggle-drawer::before {
      content: "‹";
    }

    #drawer-wheel {
      position: absolute;
      inset: 0;
      pointer-events: none;
      touch-action: none;
      cursor: grab;
    }

    #drawer-wheel:active {
      cursor: grabbing;
    }

    #drawer-wheel::before {
      content: "";
      position: absolute;
      left: 178px;
      top: 103px;
      width: 94px;
      height: 94px;
      border: 1px dashed rgba(128, 223, 255, 0.45);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(0, 153, 255, 0.22);
      pointer-events: none;
    }

    #drawer-wheel::after {
      content: "↻";
      position: absolute;
      left: 207px;
      top: 131px;
      color: rgba(177, 238, 255, 0.88);
      font-size: 28px;
      line-height: 36px;
      text-shadow: 0 0 12px rgba(0, 174, 255, 0.95);
      pointer-events: none;
    }

    .drawer-action {
      position: absolute;
      left: 0;
      top: 0;
      width: 70px;
      min-height: 48px;
      padding: 6px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) rotate(var(--counter-rotation, 0deg));
      transition: opacity 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    #game-drawer.open .drawer-action {
      opacity: 1;
      pointer-events: auto;
    }

    #social-links {
      position: absolute;
      top: 50%;
      left: calc(100% + 6px);
      display: none;
      flex-direction: column;
      gap: 10px;
      width: min(144px, calc(100vw - 166px));
      transform: translateY(-50%);
    }

    #game-drawer.links-open #social-links {
      display: flex;
    }

    #social-links a {
      display: block;
      padding: 13px 12px;
      border: 1px solid rgba(91, 203, 255, 0.85);
      border-radius: 14px;
      background: rgba(0, 30, 74, 0.9);
      color: white;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 0 12px rgba(0, 153, 255, 0.58), inset 0 0 12px rgba(0, 153, 255, 0.18);
      backdrop-filter: blur(10px);
      text-shadow: 0 0 8px rgba(110, 220, 255, 0.9);
    }

    #gesture-hint {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 1250;
      width: max-content;
      max-width: 88vw;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.78);
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      pointer-events: none;
    }

    #gesture-hint.visible {
      opacity: 1;
      visibility: visible;
    }

    @keyframes guide-pulse {
      from { opacity: 0.48; }
      to { opacity: 1; }
    }

    @keyframes status-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #camera-status.loading::before,
      #target-indicator.inactive {
        animation: none;
      }
    }
  </style>
</head>
<body>

  <div id="camera-status" class="loading" role="status" aria-live="polite">Memeriksa kamera...</div>
  <div id="studio-sync-status" role="status" aria-live="polite">Memeriksa katalog Studio...</div>
  <svg id="target-indicator" class="inactive" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">
    <polygon id="target-indicator-shape" points="0,0 0,0 0,0 0,0"></polygon>
  </svg>
  <div id="gesture-hint" role="status" aria-live="polite"></div>
  <section id="rotation-controller" aria-label="Kontrol rotasi karya" aria-hidden="true">
    <h2>Sudut & Rotasi</h2>
    <div id="pose-mode-controls">
      <h3>Mode sudut</h3>
      <div id="pose-mode-buttons" role="group" aria-label="Pilih mode sudut karya">
        <button type="button" data-pose-mode="attached" aria-pressed="true">Tempel</button>
        <button type="button" data-pose-mode="angle" aria-pressed="false">45°</button>
        <button type="button" data-pose-mode="free" aria-pressed="false">Bebas</button>
      </div>
    </div>
    <span></span>
    <button type="button" data-axis="x" data-step="-15" aria-label="Putar ke atas 15 derajat">↑</button>
    <span></span>
    <button type="button" data-axis="y" data-step="-15" aria-label="Putar ke kiri 15 derajat">←</button>
    <button type="button" data-axis="x" data-step="15" aria-label="Putar ke bawah 15 derajat">↓</button>
    <button type="button" data-axis="y" data-step="15" aria-label="Putar ke kanan 15 derajat">→</button>
    <button id="parallax-toggle" type="button" aria-pressed="false">Visual: Normal</button>
  </section>
  <div id="game-drawer" aria-label="Menu AR">
    <button id="toggle-drawer" type="button" aria-expanded="false" aria-controls="drawer-reset drawer-toggle-image drawer-toggle-links">MENU</button>
    <div id="drawer-wheel">
      <button id="drawer-reset" class="drawer-action" type="button">Atur ulang</button>
      <button id="drawer-toggle-image" class="drawer-action" type="button">Sembunyikan gambar</button>
      <button id="drawer-toggle-links" class="drawer-action" type="button" aria-expanded="false" aria-controls="social-links">Tautan</button>
    </div>
    <nav id="social-links" aria-label="Tautan sekolah">
      <a href="https://smkbinamandirimultimedia.sch.id/" target="_blank" rel="noopener noreferrer">Website</a>
      <a href="https://www.instagram.com/smkbm_3/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </nav>
  </div>
  <!-- Ganti imageTargetSrc dengan file .mind Anda -->
  <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: false; maxTrack: 1; uiScanning: #scanning-overlay;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets></a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>

  <div id="scanning-overlay" aria-live="polite">
    <section id="scan-guidance">
      <h1 id="scan-guidance-title">Siap memindai?</h1>
      <p id="scan-guidance-description">Tekan mulai, lalu arahkan kamera perlahan ke gambar yang rata, terang, dan terlihat utuh.</p>
      <button id="retry-camera" class="visible" type="button">Mulai pemindaian</button>
    </section>
  </div>

  <script>
    async function initializeAR() {
    const scene = document.querySelector('a-scene');
    const cameraStatus = document.getElementById('camera-status');
    const scanGuidanceTitle = document.getElementById('scan-guidance-title');
    const scanGuidanceDescription = document.getElementById('scan-guidance-description');
    const retryCameraButton = document.getElementById('retry-camera');
    const targetIndicator = document.getElementById('target-indicator');
    const targetIndicatorShape = document.getElementById('target-indicator-shape');
    const gestureHint = document.getElementById('gesture-hint');
    const rotationController = document.getElementById('rotation-controller');
    const parallaxToggle = document.getElementById('parallax-toggle');
    const poseModeButtons = document.getElementById('pose-mode-buttons');
    const gameDrawer = document.getElementById('game-drawer');
    const drawerWheel = document.getElementById('drawer-wheel');
    const drawerButton = document.getElementById('toggle-drawer');
    const resetButton = document.getElementById('drawer-reset');
    const toggleButton = document.getElementById('drawer-toggle-image');
    const linksButton = document.getElementById('drawer-toggle-links');
    let targets = [];
    let activeTarget = null;
    let activeTargetImage = null;
    let rotatableImage = null;
    let targetVisible = false;
    let imageEnabled = true;
    let poseMode = 'attached';
    let configuredPoseZ = 0.65;
    let poseTransitionFrame = null;
    let parallaxEnabled = false;
    let activeParallaxPlanes = [];
    let activeParallaxProfile = null;
    let parallaxPermissionRequested = false;
    let parallaxAnimationFrame = null;
    let parallaxInputX = 0;
    let parallaxInputY = 0;
    let parallaxCurrentX = 0;
    let parallaxCurrentY = 0;
    let activePointer = null;
    let previousPointerX = 0;
    let previousPointerY = 0;
    let gestureHintTimeout = null;
    let animationFrame = null;
    let guideAnimationFrame = null;
    let guideHideTimeout = null;
    let drawerPointerId = null;
    let lastDrawerPointerAngle = 0;
    let drawerRotation = 0;
    const activePointers = new Map();
    let pinchStartDistance = 0;
    let pinchStartScale = 1;
    const SCAN_GUIDE_VISIBLE_MS = 1200;
    const PARALLAX_SMOOTHING = 0.12;
    const POSE_MODES = {
      attached: { label: 'Tempel', z: 0.05, rotationX: 0 },
      angle: { label: '45°', z: 0.2, rotationX: -Math.PI / 4 },
      free: { label: 'Bebas', rotationX: 0 }
    };

    function setCameraStatus(message, type = '') {
      cameraStatus.textContent = message;
      cameraStatus.classList.remove('error', 'ready', 'loading');
      if (type) cameraStatus.classList.add(type);
    }

    function setScanGuidance(title, description, retry = false) {
      scanGuidanceTitle.textContent = title;
      scanGuidanceDescription.textContent = description;
      retryCameraButton.classList.toggle('visible', retry);
    }

    function setTargetIndicator(state) {
      targetIndicator.classList.remove('active', 'inactive');
      if (state === 'active') {
        targetIndicator.classList.add('active');
      } else if (state === 'inactive') {
        targetIndicator.classList.add('inactive');
        targetIndicator.style.display = 'block';
      } else {
        targetIndicator.style.display = 'none';
      }
    }

    function setGuidePoints(points) {
      targetIndicatorShape.setAttribute(
        'points',
        points.map(point => `${point.x},${point.y}`).join(' ')
      );
    }

    function getSmallGuidePoints() {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const size = Math.min(44, window.innerWidth * 0.14, window.innerHeight * 0.08);
      const half = size / 2;
      return [
        { x: centerX - half, y: centerY - half },
        { x: centerX + half, y: centerY - half },
        { x: centerX + half, y: centerY + half },
        { x: centerX - half, y: centerY + half }
      ];
    }

    function getTargetScreenPoints() {
      if (!scene.camera || !activeTarget || !activeTargetImage) return null;
      scene.object3D.updateMatrixWorld(true);
      scene.camera.updateMatrixWorld(true);
      const halfHeight = activeTargetImage.naturalHeight / activeTargetImage.naturalWidth / 2;
      const corners = [
        [-0.5, -halfHeight, 0],
        [0.5, -halfHeight, 0],
        [0.5, halfHeight, 0],
        [-0.5, halfHeight, 0]
      ];
      const points = corners.map(([x, y, z]) => {
        const point = activeTarget.object3D.localToWorld(new THREE.Vector3(x, y, z));
        point.project(scene.camera);
        return {
          x: (point.x + 1) * 0.5 * window.innerWidth,
          y: (1 - point.y) * 0.5 * window.innerHeight
        };
      });
      return points.every(point => Number.isFinite(point.x) && Number.isFinite(point.y))
        ? points
        : null;
    }

    function resetScanGuide() {
      window.clearTimeout(guideHideTimeout);
      if (guideAnimationFrame !== null) {
        window.cancelAnimationFrame(guideAnimationFrame);
        guideAnimationFrame = null;
      }
      targetIndicator.setAttribute('viewBox', `0 0 ${window.innerWidth} ${window.innerHeight}`);
      setGuidePoints(getSmallGuidePoints());
      setTargetIndicator('inactive');
    }

    function animateScanGuideToTarget() {
      window.clearTimeout(guideHideTimeout);
      if (guideAnimationFrame !== null) window.cancelAnimationFrame(guideAnimationFrame);
      const startPoints = getSmallGuidePoints();
      const startTime = performance.now();
      const duration = 420;

      function animate(now) {
        if (!targetVisible) {
          guideAnimationFrame = null;
          return;
        }
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const currentTargetPoints = getTargetScreenPoints();
        if (currentTargetPoints) {
          setGuidePoints(progress < 1
            ? startPoints.map((point, index) => ({
              x: point.x + (currentTargetPoints[index].x - point.x) * eased,
              y: point.y + (currentTargetPoints[index].y - point.y) * eased
            }))
            : currentTargetPoints);
        }
        if (elapsed >= SCAN_GUIDE_VISIBLE_MS) {
          setTargetIndicator('none');
          guideAnimationFrame = null;
          return;
        }
        guideAnimationFrame = window.requestAnimationFrame(animate);
      }

      setTargetIndicator('active');
      targetIndicator.setAttribute('viewBox', `0 0 ${window.innerWidth} ${window.innerHeight}`);
      guideAnimationFrame = window.requestAnimationFrame(animate);
      guideHideTimeout = window.setTimeout(() => {
        if (targetVisible) setTargetIndicator('none');
        if (guideAnimationFrame !== null) {
          window.cancelAnimationFrame(guideAnimationFrame);
          guideAnimationFrame = null;
        }
      }, SCAN_GUIDE_VISIBLE_MS);
    }

    function updateDrawerWheel() {
      const actions = [resetButton, toggleButton, linksButton];
      const baseAngles = [-90, 30, 150];
      const pivotX = 225;
      const pivotY = 150;
      const radius = 40;
      actions.forEach((button, index) => {
        const angle = (baseAngles[index] + drawerRotation) * Math.PI / 180;
        const centerX = pivotX + Math.cos(angle) * radius;
        const centerY = pivotY + Math.sin(angle) * radius;
        button.style.left = `${centerX}px`;
        button.style.top = `${centerY}px`;
        button.style.setProperty('--counter-rotation', `${-drawerRotation}deg`);
      });
    }

    function getDrawerPointerAngle(event) {
      const bounds = gameDrawer.getBoundingClientRect();
      const pivotX = bounds.left + 225;
      const pivotY = bounds.top + 150;
      return Math.atan2(event.clientY - pivotY, event.clientX - pivotX) * 180 / Math.PI;
    }

    function updateImageVisibility() {
      rotatableImage.object3D.visible = targetVisible && imageEnabled;
      gameDrawer.classList.toggle('visible', targetVisible);
      rotationController.classList.toggle('visible', targetVisible && imageEnabled);
      rotationController.setAttribute('aria-hidden', String(!targetVisible || !imageEnabled));

        const stage = document.createElement('a-entity');
        stage.setAttribute('position', '0 0 0.65');
        const pedestal = document.createElement('a-cylinder');
        pedestal.setAttribute('radius', '0.56');
        pedestal.setAttribute('height', '0.06');
        pedestal.setAttribute('position', `0 ${0.08 - height / 2 - 0.04} 0`);
        pedestal.setAttribute('material', 'color: #10232c; metalness: 0.2; roughness: 0.85');

        const wrapper = document.createElement('a-entity');
        wrapper.classList.add('rotatable-image');
        wrapper.dataset.baseZ = '0.05';
        wrapper.setAttribute('position', '0 0.08 0.05');
        const plane = document.createElement('a-plane');
        plane.setAttribute('src', `#${artworkId}`);
        plane.setAttribute('width', '1');
        plane.setAttribute('height', String(height));
        plane.setAttribute('material', 'shader: flat; side: double; transparent: true');
        wrapper.append(plane);
        stage.append(pedestal, wrapper);
        target.append(stage);
        scene.append(target);
      }
    }

    function addTarget(record, markerUrl, contentUrl) {
      const assets = scene.querySelector('a-assets');
      const markerId = `target-image-${record.target_index}`;
      const contentId = `ar-content-${record.target_index}`;
      const marker = document.createElement('img');
      marker.id = markerId;
      marker.src = markerUrl;
      assets.append(marker);

      const content = document.createElement(record.content_type === 'video' ? 'video' : 'img');
      content.id = contentId;
      content.src = contentUrl;
      if (record.content_type === 'video') {
        content.loop = true;
        content.muted = true;
        content.playsInline = true;
      }
      assets.append(content);

      const target = document.createElement('a-entity');
      target.id = `image-target-${record.target_index}`;
      target.setAttribute('mindar-image-target', `targetIndex: ${record.target_index}`);
      target.dataset.imageId = markerId;
      target.dataset.targetName = record.title;
      const titleHash = Array.from(record.title || String(record.target_index))
        .reduce((hash, character) => (hash * 31 + character.charCodeAt(0)) >>> 0, 0);
      setParallaxProfile(target, [
        0.02 + (titleHash % 16) / 1000,
        0.02 + ((titleHash >>> 4) % 16) / 1000,
        0.025 + ((titleHash >>> 8) % 20) / 1000
      ]);
      const wrapper = document.createElement('a-entity');
      wrapper.classList.add('rotatable-image');
      wrapper.dataset.baseZ = String(record.position_z);
      wrapper.setAttribute('position', `${record.position_x} ${record.position_y} ${record.position_z}`);

      const plane = document.createElement('a-plane');
      plane.setAttribute('src', `#${contentId}`);
      plane.setAttribute('width', String(record.width));
      plane.setAttribute('height', String(record.height));
      plane.setAttribute('material', 'shader: flat; side: double');
      wrapper.append(plane);
      target.append(wrapper);
      scene.append(target);
    }

    async function loadStudioTargets() {
      const records = (await getTargets())
        .filter(record => record.enabled)
        .sort((left, right) => left.target_index - right.target_index);
      if (!records.length) {
        await addBuiltInTargets();
        syncStatus.textContent = `Katalog AR · ${AR_TARGETS.length} marker unik dari 27 file`;
        return;
      }

      const indices = new Set();
      records.forEach(record => {
        if (!Number.isInteger(record.target_index) || record.target_index < 0 || indices.has(record.target_index)) {
          throw new Error('Index target Studio tidak valid atau duplikat.');
        }
        if (!['image', 'video'].includes(record.content_type) || !record.marker_blob || !record.content_blob) {
          throw new Error(`Data karya "${record.title}" tidak lengkap.`);
        }
        indices.add(record.target_index);
      });

      const mindFile = await getMindFile();
      scene.querySelectorAll('[mindar-image-target]').forEach(target => target.remove());
      const assets = scene.querySelector('a-assets');
      assets.querySelectorAll('[id^="target-image-"], [id^="ar-content-"]').forEach(asset => asset.remove());
      scene.setAttribute(
        'mindar-image',
        `imageTargetSrc: ${mindFile?.file ? URL.createObjectURL(mindFile.file) : 'targets.mind'}; autoStart: false; uiScanning: #scanning-overlay;`
      );
      records.forEach(record => addTarget(
        record,
        URL.createObjectURL(record.marker_blob),
        URL.createObjectURL(record.content_blob)
      ));
      syncStatus.textContent = `Studio lokal · ${records.length} karya di browser ini`;
    }

    try {
      await loadStudioTargets();
    } catch (error) {
      syncStatus.textContent = 'Data Studio lokal gagal dimuat. Periksa penyimpanan browser.';
      console.error('Gagal memuat konten Studio:', error);
    }
    await window.initializeAR();
  </script>

</body>
</html>
