<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>2.5D Parallax Demo - Screenshot 2026-10-26 153942.png</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .stage {
      position: relative;
      width: min(85vw, 900px);
      aspect-ratio: 783 / 922;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
      border: 1px solid #1e293b;
      background: #020617;
    }
    .layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      transition: transform 0.08s ease-out;
    }
    .caption {
      margin-top: 18px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <img class="layer" data-depth="0.1" src="03_background.png" alt="Background Plate - Atmosphere & Backdrop" />
    <img class="layer" data-depth="0.1" src="02_midground.png" alt="Midground - Environment Elements" />
    <img class="layer" data-depth="0.5" src="01_foreground.png" alt="Foreground - Main Subject" />
  </div>
  <p class="caption">Hover mouse to interact with 2.5D Parallax &bull; Generated by Parallax Layer Generator AI</p>

  <script>
    const stage = document.getElementById('stage');
    const layers = document.querySelectorAll('.layer');
    const maxOffset = 30;

    stage.addEventListener('mousemove', (e) => {
      const rect = stage.getBoundingClientRect();
      const normX = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
      const normY = ((e.clientY - rect.top) / rect.height - 0.5) * 2;

      layers.forEach(img => {
        const depth = parseFloat(img.getAttribute('data-depth')) || 1.0;
        const ox = normX * maxOffset * depth;
        const oy = normY * maxOffset * depth;
        img.style.transform = `translate3d(${ox}px, ${oy}px, 0)`;
      });
    });

    stage.addEventListener('mouseleave', () => {
      layers.forEach(img => {
        img.style.transform = 'translate3d(0, 0, 0)';
      });
    });
  </script>
</body>
</html>
